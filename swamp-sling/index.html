<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Swamp Sling</title>
<style>
  :root { --orange:#FA4616; --blue:#0021A5; }
  html, body { margin:0; height:100%; overflow:hidden; background:#050d2e; font-family:"Trebuchet MS", "Segoe UI", sans-serif; }
  #stage { position:absolute; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas { position:absolute; left:0; top:0; width:1280px; height:720px; display:block; }
  .hidden { display:none !important; }
  #hud { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  #hud button { width:48px; height:48px; border-radius:50%; border:3px solid #fff; background:var(--blue); color:#fff; font-size:22px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  #hud button:hover { background:var(--orange); }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; }
  #title { background:linear-gradient(160deg, #0021A5 0%, #06123f 55%, #FA4616 140%); }
  #title h1 { font-size:120px; margin:0; line-height:1; letter-spacing:4px; color:var(--orange); -webkit-text-stroke:4px #fff; text-shadow:0 8px 0 rgba(0,0,0,.4); font-family:Impact, "Arial Black", sans-serif; }
  #title h2 { font-size:34px; margin:14px 0 40px; font-weight:700; }
  #title small, #levels small { position:absolute; bottom:14px; left:0; right:0; opacity:.7; font-size:14px; }
  .btn { font:700 28px "Trebuchet MS", sans-serif; padding:14px 44px; margin:8px; border-radius:40px; border:4px solid #fff; background:var(--orange); color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.4); }
  .btn:hover { filter:brightness(1.12); }
  .btn.alt { background:var(--blue); font-size:22px; padding:10px 28px; }
  #levels { background:rgba(4,14,60,.96); justify-content:flex-start; padding-top:30px; }
  #levels h1 { margin:0 0 4px; font-size:44px; color:var(--orange); font-family:Impact, "Arial Black", sans-serif; letter-spacing:2px; }
  #levels p { margin:0 0 18px; font-size:18px; opacity:.85; }
  #grid { display:grid; grid-template-columns:repeat(5, 224px); gap:14px; }
  .tile { height:150px; border-radius:16px; border:4px solid #fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 5px 0 rgba(0,0,0,.45); position:relative; padding:0 6px; }
  .tile:hover { transform:translateY(-3px); }
  .tile .n { position:absolute; top:6px; left:10px; font-size:15px; font-weight:700; opacity:.85; }
  .tile .s { font:700 22px "Trebuchet MS", sans-serif; line-height:1.05; }
  .tile .m { font-size:15px; margin-top:3px; opacity:.9; }
  .tile .st { font-size:24px; margin-top:6px; letter-spacing:3px; }
  .tile.locked { filter:grayscale(.85) brightness(.55); cursor:not-allowed; }
  .tile.locked:hover { transform:none; }
  #result { background:rgba(0,0,0,.55); }
  #card { background:var(--blue); border:6px solid #fff; border-radius:28px; padding:28px 60px 30px; min-width:520px; box-shadow:0 12px 0 rgba(0,0,0,.4); }
  #card h1 { margin:0; font-size:56px; color:var(--orange); font-family:Impact, "Arial Black", sans-serif; letter-spacing:2px; -webkit-text-stroke:1.5px #fff; }
  #card p { font-size:22px; margin:8px 0; }
  #rStars { font-size:70px; letter-spacing:10px; color:#ffd23f; line-height:1.1; }
  #rStars .off { color:rgba(255,255,255,.25); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>

  <div id="hud" class="hidden">
    <button id="bRestart" title="Restart level">&#8635;</button>
    <button id="bMenu" title="Level select">&#9776;</button>
    <button id="bSound" title="Sound on/off">&#128266;</button>
  </div>

  <div id="title" class="screen">
    <h1>SWAMP SLING</h1>
    <h2>The Gators take on every stadium in the conference</h2>
    <button class="btn" id="bPlay">PLAY</button>
    <small>Unofficial fan-made game. Not affiliated with or endorsed by any school or conference.</small>
  </div>

  <div id="levels" class="screen hidden">
    <h1>ROAD TRIP</h1>
    <p>Knock out every mascot to win. Spare gators earn extra stars.</p>
    <div id="grid"></div>
  </div>

  <div id="result" class="screen hidden">
    <div id="card">
      <h1 id="rTitle"></h1>
      <div id="rStars"></div>
      <p id="rText"></p>
      <p id="rScore"></p>
      <div>
        <button class="btn" id="bNext">NEXT</button><br>
        <button class="btn alt" id="bRetry">Replay</button>
        <button class="btn alt" id="bLevels">Levels</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
