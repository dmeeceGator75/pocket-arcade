<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fairway Quest</title>
<style>
:root{--bg:#12301b;--panel:#173a22;--panel2:#1f4a2c;--line:#2f6a40;--txt:#eef6ea;--dim:#a9c4ac;--acc:#f4c542;--good:#7fe08a;--bad:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2c6b3a,#0d2414);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.hidden{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;width:100%;max-width:760px;box-shadow:0 12px 40px rgba(0,0,0,.45);margin:auto}
.panel.wide{max-width:1040px}
h1{margin:0 0 4px;font-size:40px;letter-spacing:1px;color:var(--acc);text-shadow:0 2px 0 #7a5a00}
h2{margin:0 0 14px;font-size:24px}
h3{margin:16px 0 8px;font-size:15px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
p{color:var(--dim);line-height:1.5;margin:6px 0}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){background:#2a6139;border-color:#4b9a5e}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);color:#2a2000;border-color:#b98f12;font-weight:700}
button.primary:hover:not(:disabled){background:#ffd75e;border-color:#b98f12}
button.danger{border-color:#8a3a30;color:#ffb3a8}
button.big{display:block;width:100%;padding:13px;font-size:17px;margin:9px 0}
button.sel{outline:2px solid var(--acc);background:#2a6139}
input[type=text],input[type=number],select{font:inherit;background:#0f2716;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.card .t{font-weight:700;font-size:16px}
.small{font-size:13px;color:var(--dim)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #0006;cursor:pointer;padding:0}
.sw.sel{outline:3px solid var(--acc)}
.bar{height:12px;background:#0f2716;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#f4c542,#ffe58a)}
.stat{display:grid;grid-template-columns:96px 1fr 34px 34px;gap:8px;align-items:center;margin:7px 0}
.pips{display:flex;gap:2px}.pips i{flex:1;height:10px;background:#0f2716;border-radius:2px}.pips i.on{background:var(--good)}
table.sc{border-collapse:collapse;width:100%;font-size:13px;text-align:center;margin:6px 0}
table.sc td,table.sc th{border:1px solid var(--line);padding:4px 2px;min-width:26px}
table.sc th{background:#0f2716;color:var(--dim);font-weight:600}
.under{color:var(--good);font-weight:700}.over{color:var(--bad)}
.tag{display:inline-block;background:#0f2716;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--dim);margin-right:6px}
.coin{color:var(--acc);font-weight:700}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>div{position:absolute;background:rgba(10,30,16,.82);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:auto}
#hud #hudQuit{left:8px;top:8px;padding:0;border:none;background:none}
#hudQuit button{padding:4px 10px;font-size:12px;background:rgba(10,30,16,.82)}
#hud #hudClub{left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:3px;width:max-content;max-width:calc(100vw - 12px);padding:5px 10px}
#hudClub button{padding:3px 12px;font-size:13px}
#hud #hudClub .nm{min-width:170px}#hud #hudClub .nm b{display:inline;font-size:15px;margin-right:6px}
#hud #hudSwing{left:50%;bottom:12px;transform:translateX(-50%);padding:0;border:none;background:none}
#hud #swingBtn{width:min(352px,calc(100vw - 16px));height:62px;font-size:24px;letter-spacing:1px;border-width:2px;box-shadow:0 4px 14px rgba(0,0,0,.5);white-space:nowrap}
#hudTxt{font-size:12px;line-height:1.4;color:var(--dim);text-align:center}
#hudTxt b{color:var(--acc)}
.clubRow{display:flex;gap:10px;align-items:center;justify-content:center}
table.lb{border-collapse:collapse;width:100%;margin:10px 0}
table.lb td,table.lb th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.lb th{color:var(--dim);font-weight:600;font-size:13px}
table.lb td:first-child,table.lb th:first-child{width:44px;color:var(--dim)}
table.lb td:last-child,table.lb th:last-child{text-align:right}
table.lb tr.me td{background:#2a6139;color:var(--txt);font-weight:700}
#hudClub .nm{min-width:150px;text-align:center}
#hudClub .nm b{display:block;font-size:17px}
canvas#cv{touch-action:none}
html{touch-action:manipulation}
@media(max-width:1000px){#hudHelp{display:none}}
@media(max-width:700px){
  #hudTxt{font-size:11px}#hud #hudClub button{padding:6px 14px}
  .card .row>div:first-child{min-width:100%}
  #ui{padding:10px 8px}.panel{padding:16px 14px}h1{font-size:32px}h2{font-size:20px}
  #ui #ed{flex-direction:column;height:auto}#ui #edSide{width:100%;overflow:visible}#ui #edMain{order:-1;position:sticky;top:0;z-index:2;height:50vh;flex:none;padding:8px}
}
#hudHelp{left:12px;bottom:12px;font-size:12px;color:var(--dim);max-width:250px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
/* editor */
#ed{display:flex;gap:14px;width:100%;height:calc(100vh - 48px);max-width:1300px;margin:0 auto}
#edSide{width:300px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
#edMain{flex:1;overflow:auto;background:#0b1d11;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
#edCv{cursor:crosshair;image-rendering:pixelated}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.holes button{padding:5px 0;font-size:13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tools button{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:13px;text-align:left}
.tools i{width:16px;height:16px;border-radius:3px;border:1px solid #0008;flex:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="hudQuit"><button id="quitBtn">&#10005; Quit</button></div>
  <div id="hudClub"><div id="hudTxt"></div><div class="clubRow"><button id="clubPrev" title="Q">&#9664;</button><div class="nm" id="clubName"></div><button id="clubNext" title="E">&#9654;</button></div></div>
  <div id="hudSwing"><button id="swingBtn" class="primary">Swing</button></div>
  <div id="hudHelp">Move mouse to aim &bull; Click / Space: start swing, set power, set accuracy &bull; Q / E or wheel: change club &bull; Esc: cancel swing</div>
</div>
<div id="ui"></div>
<div id="modal" class="hidden"></div>
<script>
'use strict';
/* ============================================================
   FAIRWAY QUEST - top-down golf RPG with an 18-hole course designer
   ============================================================ */
const TILE=5;   // yards per tile
const PPY=5;    // bitmap pixels per yard
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- data ---------------- */
const TER={
  r:{name:'Rough',  col:'#3d8b3a',decel:30, dist:.85,dev:1.35,roll:.5},
  f:{name:'Fairway',col:'#5db54c',decel:11, dist:1,  dev:1,   roll:1},
  e:{name:'Tee box',col:'#74cc60',decel:11, dist:1,  dev:1,   roll:1},
  g:{name:'Green',  col:'#8ee076',decel:5.5,dist:1,  dev:1,   roll:.9},
  s:{name:'Bunker', col:'#ead9a0',decel:70, dist:.7, dev:1.5, roll:.08},
  w:{name:'Water',  col:'#3b8fd6',decel:99, dist:1,  dev:1,   roll:0},
  t:{name:'Trees',  col:'#1f5c2b',decel:45, dist:.6, dev:1.7, roll:.3},
  o:{name:'Out of bounds',col:'#0d2414',decel:99,dist:1,dev:1,roll:0}
};
// desert courses reuse the same tiles, but "rough" is open desert and "trees" are cactus and rocks
const DESERT={
  r:{name:'Desert', col:'#d9a868',decel:38,dist:.8, dev:1.4,roll:.4},
  t:{name:'Cactus & rocks',col:'#b98452',decel:60,dist:.55,dev:1.8,roll:.2},
  s:{name:'Bunker', col:'#f7eed6',decel:70,dist:.7, dev:1.5,roll:.08}
};
// tropical courses: each hole is an island - beach sand, then ocean, with palms instead of trees
const TROPIC={
  r:{name:'Rough', col:'#2f9a4c',decel:30,dist:.85,dev:1.35,roll:.5},
  t:{name:'Palms', col:'#1f7a3d',decel:45,dist:.65,dev:1.6, roll:.3},
  s:{name:'Sand',  col:'#fbf1d0',decel:70,dist:.7, dev:1.5, roll:.08},
  w:{name:'Ocean', col:'#27b3c9',decel:99,dist:1,  dev:1,   roll:0}
};
// mountain courses: pine forest and rock, grey scree instead of sand, and stronger wind
const MOUNTAIN={
  r:{name:'Alpine rough',col:'#4b8b5e',decel:32,dist:.83,dev:1.4,roll:.45},
  t:{name:'Pines',col:'#2c5b45',decel:45,dist:.6,dev:1.7,roll:.3},
  s:{name:'Scree',col:'#d2ccba',decel:70,dist:.7,dev:1.5,roll:.08},
  w:{name:'Lake',col:'#2f74c0',decel:99,dist:1,dev:1,roll:0}
};
// fantasy courses: purple moss, teal fairways, mushrooms and crystals, and lava where the water would be
const FANTASY={
  r:{name:'Moss',col:'#6a4d9e',decel:30,dist:.85,dev:1.35,roll:.5},
  f:Object.assign({},TER.f,{col:'#35c4a4'}),e:Object.assign({},TER.e,{col:'#5fe0c0'}),g:Object.assign({},TER.g,{col:'#a8f7de'}),
  t:{name:'Mushrooms',col:'#4b3380',decel:45,dist:.6,dev:1.7,roll:.3},
  s:{name:'Stardust',col:'#f7bfe8',decel:70,dist:.7,dev:1.5,roll:.08},
  w:{name:'Lava',col:'#ff6a1f',decel:99,dist:1,dev:1,roll:0}
};
const THEME_TER={desert:DESERT,tropical:TROPIC,mountain:MOUNTAIN,fantasy:FANTASY};
const waterMsg=h=>{const n=terOf(h,'w').name;return n==='Water'?'Water hazard!':'In the '+n.toLowerCase()+'!';};
const terOf=(h,ch)=>(h&&THEME_TER[h.theme]&&THEME_TER[h.theme][ch])||TER[ch];
const PAINTABLE=['r','f','g','s','w','t','e'];
const CLUBS=[
  {id:'DR',name:'Driver', dist:230,apex:28,roll:.22,cat:'driver'},
  {id:'3W',name:'3 Wood', dist:205,apex:26,roll:.20,cat:'iron'},
  {id:'5W',name:'5 Wood', dist:188,apex:27,roll:.18,cat:'iron'},
  {id:'4I',name:'4 Iron', dist:172,apex:24,roll:.16,cat:'iron'},
  {id:'5I',name:'5 Iron', dist:162,apex:25,roll:.15,cat:'iron'},
  {id:'6I',name:'6 Iron', dist:152,apex:26,roll:.13,cat:'iron'},
  {id:'7I',name:'7 Iron', dist:141,apex:27,roll:.11,cat:'iron'},
  {id:'8I',name:'8 Iron', dist:129,apex:28,roll:.09,cat:'iron'},
  {id:'9I',name:'9 Iron', dist:116,apex:29,roll:.07,cat:'iron'},
  {id:'PW',name:'Pitching Wedge',dist:102,apex:30,roll:.05,cat:'wedge'},
  {id:'SW',name:'Sand Wedge',dist:78,apex:30,roll:.03,cat:'wedge'},
  {id:'PT',name:'Putter', dist:0,apex:0,roll:1,cat:'putter'}
];
const SLOTS={driver:'Driver',irons:'Woods & Irons',wedge:'Wedges',putter:'Putter',ball:'Golf Balls'};
const EQUIP={
  driver:[
    {name:'Hand-me-down Driver',lvl:1,price:0,dist:0,acc:0},
    {name:'Steelhead 300',lvl:3,price:150,dist:.04,acc:.06},
    {name:'Titan Ti',lvl:6,price:450,dist:.08,acc:.12},
    {name:'Carbon Cannon',lvl:10,price:1000,dist:.13,acc:.18},
    {name:'Thunderclap Pro',lvl:15,price:2200,dist:.18,acc:.25},
    {name:'HX Tour Driver',lvl:10,price:3600,dist:.22,acc:.30,req:'card'},
    {name:'Black Series Driver',lvl:14,price:6200,dist:.26,acc:.35,req:'rookieWin'}],
  irons:[
    {name:'Garage Sale Irons',lvl:1,price:0,dist:0,acc:0},
    {name:'Cavity Backs',lvl:2,price:120,dist:.03,acc:.08},
    {name:'Forged Blades',lvl:5,price:400,dist:.06,acc:.14},
    {name:'Tour Precision',lvl:9,price:950,dist:.09,acc:.21},
    {name:'Laser Line Elite',lvl:14,price:2000,dist:.13,acc:.28},
    {name:'HX Forged Irons',lvl:10,price:3400,dist:.16,acc:.33,req:'card'},
    {name:'Black Series Irons',lvl:14,price:6000,dist:.19,acc:.38,req:'rookieWin'}],
  wedge:[
    {name:'Rusty Wedges',lvl:1,price:0,rec:0,spin:0},
    {name:'Grinder Wedges',lvl:2,price:100,rec:.12,spin:.2},
    {name:'Spin Milled',lvl:5,price:350,rec:.24,spin:.4},
    {name:'Escape Artist',lvl:9,price:800,rec:.36,spin:.55},
    {name:'Sand Wizard',lvl:13,price:1700,rec:.5,spin:.7},
    {name:'HX Grind Wedges',lvl:10,price:3000,rec:.58,spin:.78,req:'card'},
    {name:'Black Series Wedges',lvl:14,price:5200,rec:.66,spin:.85,req:'rookieWin'}],
  putter:[
    {name:'Mini-golf Putter',lvl:1,price:0,touch:0},
    {name:'Blade Putter',lvl:2,price:110,touch:.1},
    {name:'Mallet Master',lvl:4,price:320,touch:.2},
    {name:'Balanced Two-Ball',lvl:8,price:750,touch:.3},
    {name:'The Cup Magnet',lvl:12,price:1600,touch:.42},
    {name:'HX Tour Blade',lvl:10,price:2900,touch:.5,req:'card'},
    {name:'Black Series Putter',lvl:14,price:5000,touch:.58,req:'rookieWin'}],
  ball:[
    {name:'Range Balls',lvl:1,price:0,dist:0,wind:0},
    {name:'Two-Piece Distance',lvl:3,price:130,dist:.02,wind:.1},
    {name:'Soft Feel',lvl:6,price:380,dist:.035,wind:.2},
    {name:'Tour Urethane',lvl:10,price:900,dist:.05,wind:.32},
    {name:'Windcutter X',lvl:15,price:1900,dist:.07,wind:.45},
    {name:'HX Tour Ball',lvl:10,price:3200,dist:.085,wind:.52,req:'card'},
    {name:'Black Series Ball',lvl:14,price:5600,dist:.10,wind:.6,req:'rookieWin'}]
};
// Brands: each is a full range, one item per slot. The starter gear (tier 0) is unbranded.
// Halcyon needs a Tour Card (req:'card'); Vanta needs a Rookie Tour event win (req:'rookieWin').
const BRANDS=['','Kestrel','Ironwood','Northwind','Stratos','Halcyon','Vanta'];
Object.values(EQUIP).forEach(list=>list.forEach((it,i)=>{it.brand=BRANDS[i]||'';}));
// what still blocks buying an item ('' when nothing does)
function gearLock(it){
  const p=save.profile,t=p.tour||{pos:{}};
  if(it.req==='card'&&!t.card)return'Needs Tour Card';
  if(it.req==='rookieWin'&&!tourWins(TOURS[1],t))return'Needs a Rookie win';
  return p.level<it.lvl?'Level '+it.lvl:'';
}
function equipDesc(slot,it){
  const p=v=>'+'+Math.round(v*100)+'%';
  if(slot==='driver'||slot==='irons')return it.dist?`${p(it.dist)} distance, ${p(it.acc)} accuracy`:'No bonus';
  if(slot==='wedge')return it.rec?`${p(it.rec)} recovery from bad lies, ${p(it.spin)} spin (less roll)`:'No bonus';
  if(slot==='putter')return it.touch?`${p(it.touch)} putting control`:'No bonus';
  return it.dist?`${p(it.dist)} distance, ${p(it.wind)} wind resistance`:'No bonus';
}
const STATS={power:['Power','Hit the ball farther'],accuracy:['Accuracy','Straighter shots, slower accuracy meter'],touch:['Touch','Better putting control'],recovery:['Recovery','Less penalty from rough, sand and trees']};
const STAT_MAX=20, LEVEL_MAX=30;
const SKINS=['#f6d7bd','#f1c9a5','#d9a577','#b07a4e','#8a5a36','#5b3a24'];
const COLORS=['#e74c3c','#f39c12','#f4d03f','#2ecc71','#1abc9c','#3498db','#9b59b6','#ec6fb0','#ffffff','#95a5a6','#2c3e50','#111111'];
const HAIRS=['#1b1b1b','#4a2f1b','#8a5a2b','#d8b25a','#c0392b','#bdbdbd','#6a4bd0'];
const HATS={cap:'Cap',visor:'Visor',bucket:'Bucket hat',none:'No hat'};

/* ---------------- save data ---------------- */
const SAVE_KEY='fairway_quest_v1';
let save={profile:null,courses:[]};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s==='object'){save.profile=s.profile||null;save.courses=Array.isArray(s.courses)?s.courses:[];}}catch(e){}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){toast('Could not save - browser storage is full or blocked.');}}
function newProfile(){return{name:'',look:{skin:SKINS[1],shirt:COLORS[0],hat:COLORS[8],hatStyle:'cap',hair:HAIRS[1]},level:1,xp:0,coins:0,points:6,
  stats:{power:1,accuracy:1,touch:1,recovery:1},equip:{driver:0,irons:0,wedge:0,putter:0,ball:0},owned:{driver:[0],irons:[0],wedge:[0],putter:[0],ball:[0]},best:{},rounds:0};}
const xpNeed=l=>80+l*60;
// career points = every XP point ever earned (older saves are back-filled from level + xp)
function careerPts(p){if(p.totalXp!=null)return p.totalXp;let t=p.xp;for(let l=1;l<p.level;l++)t+=xpNeed(l);return t;}
function addXp(n){const p=save.profile;let ups=0;p.totalXp=careerPts(p)+n;p.xp+=n;while(p.level<LEVEL_MAX&&p.xp>=xpNeed(p.level)){p.xp-=xpNeed(p.level);p.level++;p.points+=2;ups++;}return ups;}
const eq=slot=>EQUIP[slot][save.profile.equip[slot]]||EQUIP[slot][0];
function clubMax(club,lie){ // full-power carry in yards from a given lie
  const p=save.profile;let m=1+.012*(p.stats.power-1)+eq('ball').dist;
  if(club.cat==='driver')m+=eq('driver').dist;else if(club.cat==='iron')m+=eq('irons').dist;
  let l=(S?terOf(S.h,lie):TER[lie]).dist;
  if(lie==='s'&&club.cat!=='wedge')l*=.85;
  if(l<1){const red=.03*(p.stats.recovery-1)+(club.cat==='wedge'?eq('wedge').rec:0);l=1-(1-l)*Math.max(.15,1-red);}
  return club.dist*m*l;
}

/* ---------------- holes & course generation ---------------- */
function terrainAt(h,x,y){const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(ty<0||ty>=h.rows.length||tx<0||tx>=h.cols)return'o';return h.rows[ty][tx];}
function holeYards(h){return Math.round(Math.hypot(h.pin.x-h.tee.x,h.pin.y-h.tee.y));}
function genHole(par,R,opt){
  opt=opt||{};const cols=40;
  const len=(par===3?120+R()*80:par===4?310+R()*120:480+R()*70)*(opt.hard?1.1:1);
  const rows=Math.round(len/TILE)+16;
  const g=[];for(let y=0;y<rows;y++)g.push(new Array(cols).fill('r'));
  const tee={x:12+R()*16,y:rows-5},grn={x:11+R()*18,y:7.5};
  let pts=[tee];const nMid=par===3?0:par===4?1:2;
  for(let i=1;i<=nMid;i++){const f=i/(nMid+1);pts.push({x:clamp(lerp(tee.x,grn.x,f)+(R()-.5)*24,9,cols-9),y:lerp(tee.y,grn.y,f)});}
  pts.push(grn);
  for(let k=0;k<2;k++){const n=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];n.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75});}n.push(pts[pts.length-1]);pts=n;}
  const path=[];let d=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/.5));
    for(let j=0;j<n;j++){const t=j/n;path.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),d:d+L*t});}d+=L;}

  const at=dd=>{let i=0;while(i<path.length-1&&path[i].d<dd)i++;const p=path[i],q=path[Math.min(path.length-1,i+2)],o=path[Math.max(0,i-2)];
    const dx=q.x-o.x,dy=q.y-o.y,L=Math.hypot(dx,dy)||1;return{x:p.x,y:p.y,nx:-dy/L,ny:dx/L};};
  const disc=(cx,cy,rx,ry,ch,ok)=>{for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
    if(y<0||y>=rows||x<0||x>=cols)continue;const ex=(x+.5-cx)/rx,ey=(y+.5-cy)/ry;if(ex*ex+ey*ey<=1&&ok.includes(g[y][x]))g[y][x]=ch;}};
  const rx=2.6+R(),ry=2.6+R(),fw=2.7+R()*.9-(opt.hard?.4:0),ph=R()*6.28;
  // fairway
  const startD=par===3?total*.6:9;
  for(const p of path){if(p.d<startD||p.d>total-ry)continue;const r=fw+.6*Math.sin(p.d*.15+ph);disc(p.x,p.y,r,r,'f','r');}
  // green
  const gph=R()*6.28;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ex=(x+.5-grn.x)/rx,ey=(y+.5-grn.y)/ry,th=Math.atan2(ey,ex),rr=1+.14*Math.sin(3*th+gph);if(ex*ex+ey*ey<=rr*rr)g[y][x]='g';}
  // tee box
  const tx=Math.floor(tee.x),ty=Math.floor(tee.y);
  for(let y=ty-1;y<=ty;y++)for(let x=tx-1;x<=tx;x++)g[y][x]='e';
  // greenside bunkers
  for(let i=0,n=1+Math.floor(R()*3);i<n;i++){const a=R()*6.28,r=1.1+R()*.7;disc(grn.x+Math.cos(a)*(rx+1.7),grn.y+Math.sin(a)*(ry+1.7),r*1.2,r,'s','rf');}
  // fairway bunkers
  if(par>3)for(let i=0,n=Math.floor(R()*3);i<n;i++){const p=at(total*(.35+R()*.4)),sd=R()<.5?-1:1,r=1.1+R()*.9;disc(p.x+p.nx*sd*(fw+1.3),p.y+p.ny*sd*(fw+1.3),r,r*1.3,'s','rf');}
  // water
  if(R()<(opt.water==null?.4:opt.water)){const r=2.5+R()*2;
    if(par===3){const p=at(total*(.3+R()*.25));disc(p.x,p.y,r*1.6,r*.9,'w','rfs');}
    else{const p=at(total*(.3+R()*.5)),sd=R()<.5?-1:1;disc(p.x+p.nx*sd*(fw+r-.6),p.y+p.ny*sd*(fw+r-.6),r,r*1.3,'w','rfs');}}
  // hard set-up: extra bunkers, trees standing in the fairway, and a pond if the hole has no water.
  // Uses its own random stream so the hole keeps the same shape as the normal version.
  if(opt.hard){const R2=rng(Math.round(len*7)+par*101);
    for(let i=0,n=par===3?2:3;i<n;i++){
      if(i===0||par===3){const a=R2()*6.28,r=1.1+R2()*.5;disc(grn.x+Math.cos(a)*(rx+1.7),grn.y+Math.sin(a)*(ry+1.7),r,r,'s','rf');}
      else{const p=at(total*(.3+R2()*.45)),sd=R2()<.5?-1:1,r=1.2+R2()*.6;disc(p.x+p.nx*sd*(fw+1.3),p.y+p.ny*sd*(fw+1.3),r,r*1.3,'s','rf');}}
    if(par>3){
      for(let i=0;i<par-3;i++){const p=at(total*(.45+i*.22+R2()*.1)),sd=R2()<.5?-1:1,o=.8+R2();disc(p.x+p.nx*sd*o,p.y+p.ny*sd*o,1,1.2,'t','f');}
      if(!g.some(r=>r.includes('w'))){const p=at(total*(.35+R2()*.4)),sd=R2()<.5?-1:1,r=2.6+R2();disc(p.x+p.nx*sd*(fw+r-.4),p.y+p.ny*sd*(fw+r-.4),r,r*1.3,'w','rfs');}}
  }
  // trees
  const p1=R()*6.28,p2=R()*6.28;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(g[y][x]!=='r')continue;let m=1e9;
    for(let i=0;i<path.length;i+=2){const q=path[i],dd=(q.x-x-.5)**2+(q.y-y-.5)**2;if(dd<m)m=dd;}m=Math.sqrt(m);
    const thr=9+1.3*(Math.sin(x*.7+p1)+Math.sin(y*.45+p2));
    if((opt.theme==='desert'||opt.theme==='fantasy')?((m>thr-3&&R()<.2)||(m>4&&R()<.04)):(m>thr||((x<1||x>cols-2)&&R()<.7)||(m>5&&R()<.05)))g[y][x]='t';}
  return{par,cols,rows:g.map(r=>r.join('')),tee:{x:tx*TILE,y:ty*TILE},
    pin:{x:(grn.x+(R()-.5)*2)*TILE,y:(grn.y+(R()-.5)*2)*TILE},slope:{dir:Math.floor(R()*8),str:Math.floor(R()*3)},theme:opt.theme};
}

/* ---------------- hand-designed holes ----------------
   Coordinates are yards: x = 0..200 across (100 is the middle), up = yards from the tee toward the green.
   path: centre line of the hole, tee first, green last.  sand / water / fairway / trees / clear: [x, up, radiusX, radiusY] patches. */
function buildHole(s){
  const cols=40,R=rng(s.seed||7),end=s.path[s.path.length-1],TP=s.theme==='tropical',rows=Math.round(end[1]/TILE)+(TP?23:13),teeRow=rows-(TP?11:5);
  const P=(x,up)=>({x:x/TILE,y:teeRow-up/TILE});
  const g=[];for(let y=0;y<rows;y++)g.push(new Array(cols).fill('r'));
  let pts=s.path.map(p=>P(p[0],p[1]));
  for(let k=0;k<2;k++){const n=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];n.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75});}n.push(pts[pts.length-1]);pts=n;}
  const path=[];let d=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/.5));
    for(let j=0;j<n;j++){const t=j/n;path.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),d:d+L*t});}d+=L;}
  const grn=pts[pts.length-1];path.push({x:grn.x,y:grn.y,d});
  const disc=(cx,cy,rx,ry,ch,ok)=>{for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
    if(y<0||y>=rows||x<0||x>=cols)continue;const ex=(x+.5-cx)/rx,ey=(y+.5-cy)/ry;if(ex*ex+ey*ey<=1&&ok.includes(g[y][x]))g[y][x]=ch;}};
  const patch=(list,ch,ok)=>(list||[]).forEach(q=>{const c=P(q[0],q[1]);disc(c.x,c.y,q[2]/TILE,(q[3]||q[2])/TILE,ch,ok);});
  const gr=s.green||[15,14],grx=gr[0]/TILE,gry=gr[1]/TILE,fw=(s.fw||16)/TILE,fs=(s.fwStart==null?50:s.fwStart)/TILE,ph=R()*6.28;
  for(const p of path){if(p.d<fs||p.d>d-gry)continue;const r=fw+.4*Math.sin(p.d*.15+ph);disc(p.x,p.y,r,r,'f','r');}
  patch(s.fairway,'f','r');patch(s.water,'w','rf');patch(s.sand,'s','rf');
  const gph=s.gph==null?R()*6.28:s.gph;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ex=(x+.5-grn.x)/grx,ey=(y+.5-grn.y)/gry,th=Math.atan2(ey,ex),rr=1+.12*Math.sin(3*th+gph);if(ex*ex+ey*ey<=rr*rr)g[y][x]='g';}
  const tx=Math.floor(pts[0].x),ty=teeRow;
  for(let y=ty-1;y<=ty;y++)for(let x=tx-1;x<=tx;x++)g[y][x]='e';
  const D=s.theme==='desert',FA=s.theme==='fantasy',p1=R()*6.28,p2=R()*6.28,gap=(s.gap||(D?30:FA?34:TP?36:45))/TILE,clear=(s.clear||[]).map(q=>({c:P(q[0],q[1]),r:q[2]/TILE}));
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(g[y][x]!=='r')continue;let m=1e9;
    for(let i=0;i<path.length;i+=2){const q=path[i],dd=(q.x-x-.5)**2+(q.y-y-.5)**2;if(dd<m)m=dd;}m=Math.sqrt(m);
    if(clear.some(q=>Math.hypot(q.c.x-x-.5,q.c.y-y-.5)<q.r))continue;
    const wob=1.2*(Math.sin(x*.7+p1)+Math.sin(y*.45+p2)),far=m>gap+wob;
    if(TP){ // island: rough, then a beach, then ocean - or thick palm jungle on the inland side when s.coast names one side
      let mi=0,md=1e9;for(let i=0;i<path.length;i+=2){const q=path[i],dd=(q.x-x-.5)**2+(q.y-y-.5)**2;if(dd<md){md=dd;mi=i;}}
      const a=path[Math.max(0,mi-2)],b=path[Math.min(path.length-1,mi+2)],q=path[mi],right=(b.x-a.x)*(y+.5-q.y)-(b.y-a.y)*(x+.5-q.x)>0;
      const e=m-gap-wob*.6,sea=!s.coast||s.coast==='both'||s.coast===(right?'right':'left');
      if(sea){if(e>2.2)g[y][x]='w';else if(e>.4)g[y][x]='s';else if(m>4.5&&R()<(e>-2?.3:.05))g[y][x]='t';}
      else if(e>0?R()<.8:(m>4.5&&R()<.05))g[y][x]='t';
      continue;}
    if((D||FA)?((far&&R()<(FA?.45:.2))||(m>4.5&&R()<.035)):(far||((x<1||x>cols-2)&&R()<.7)||(m>5&&R()<.04)))g[y][x]='t';}
  patch(s.trees,'t','r');patch(s.fwTrees,'t','rf');
  const pin=s.pin||[0,0];
  return{par:s.par,cols,rows:g.map(r=>r.join('')),tee:{x:tx*TILE,y:ty*TILE},pin:{x:grn.x*TILE+pin[0],y:grn.y*TILE-pin[1]},slope:{dir:s.slopeDir||0,str:s.slope||0},name:s.name,note:s.note,theme:s.theme,wind:s.wind};
}

/* ---------------- Rookie Tour set-ups ----------------
   The same five courses, made harder: about 10% longer, narrower fairways, trees (or cactus / palms)
   standing in the fairway, extra bunkers, and a pond on holes that had no water. */
// lvl 1 = Rookie Tour, lvl 2 = Pro Tour (narrower still, with one more bunker and one more fairway tree per hole)
function toughSpec(s,i,lvl){
  lvl=lvl||1;const pro=lvl>1;
  const R=rng(7000+i*31+s.path.length*13),K=1.1,up=v=>Math.round(v*K),sc=l=>(l||[]).map(q=>[q[0],up(q[1]),q[2],q[3]]);
  const dGap={desert:30,tropical:36,fantasy:34}[s.theme]||45,fw=Math.max(11,(s.fw||16)-(pro?3:2));
  const t=Object.assign({},s,{path:s.path.map(p=>[p[0],up(p[1])]),sand:sc(s.sand),water:sc(s.water),trees:sc(s.trees),fairway:sc(s.fairway),clear:sc(s.clear),
    fwTrees:[],fw,gap:Math.max(24,(s.gap||dGap)-(pro?8:6)),seed:(s.seed||7)+500});
  if(s.fwStart!=null)t.fwStart=up(s.fwStart);
  // point a fraction f of the way along the centre line, with the sideways direction (nx, nu)
  const P=t.path,segs=[];let L=0;for(let k=0;k<P.length-1;k++){const l=Math.hypot(P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]);segs.push(l);L+=l;}
  const at=f=>{let d=f*L,k=0;while(k<segs.length-1&&d>segs[k]){d-=segs[k];k++;}const a=P[k],b=P[k+1],q=d/segs[k],dx=b[0]-a[0],du=b[1]-a[1],l=Math.hypot(dx,du)||1;
    return{x:lerp(a[0],b[0],q),u:lerp(a[1],b[1],q),nx:du/l,nu:-dx/l};};
  const side=()=>R()<.5?-1:1,cx=v=>clamp(v,14,186),end=P[P.length-1],gr=s.green||[15,14];
  // extra greenside bunkers
  for(let n=(s.par===3?2:1)+(pro?1:0),k=0;k<n;k++){const a=R()*6.28;t.sand.push([cx(end[0]+Math.cos(a)*(gr[0]+9)),end[1]+Math.sin(a)*(gr[1]+9),7,7]);}
  if(s.par===3){const p=at(.62),sd=side();t.fwTrees.push([cx(p.x+p.nx*sd*13),p.u+p.nu*sd*13,5,6]);}
  else{
    for(let k=0,n=pro?3:2;k<n;k++){const p=at(pro?.25+k*.2+R()*.12:.3+k*.25+R()*.15),sd=side(),o=fw+8;t.sand.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,8,11]);}
    for(let k=0,n=s.par-3+(pro?1:0);k<n;k++){const p=at(pro?.4+k*.18+R()*.08:.46+k*.22+R()*.08),sd=side(),o=4+R()*5;t.fwTrees.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,5,6]);}
    if(!(s.water&&s.water.length)&&s.theme!=='tropical'){const p=at(.36+R()*.36),sd=side(),r=13+R()*4,o=fw+r-1;t.water.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,r,r*1.35]);}
  }
  return t;
}

// top-down golfer. face = direction (radians) the golfer faces; s = size in px; swing = club angle or null for no club
function drawGolfer(c,x,y,face,look,s,swing){
  c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(s*.15,s*.25,s*.9,s*.6,0,0,7);c.fill();
  c.rotate(face);c.lineCap='round';
  if(swing!=null){
    c.save();c.translate(s*.45,0);c.rotate(swing);c.strokeStyle='#e8e8e8';c.lineWidth=Math.max(1.5,s*.09);c.beginPath();c.moveTo(0,0);c.lineTo(s*1.45,0);c.stroke();
    c.fillStyle='#777';c.fillRect(s*1.36,-s*.1,s*.2,s*.32);c.restore();
    c.strokeStyle=look.skin;c.lineWidth=s*.22;c.beginPath();c.moveTo(0,-s*.6);c.lineTo(s*.45,0);c.lineTo(0,s*.6);c.stroke();
  }
  c.fillStyle=look.shirt;c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=Math.max(1,s*.05);c.beginPath();c.ellipse(0,0,s*.45,s*.85,0,0,7);c.fill();c.stroke();
  c.fillStyle=look.skin;c.beginPath();c.arc(s*.07,0,s*.42,0,7);c.fill();
  c.fillStyle=look.hair;c.beginPath();c.arc(-s*.04,0,s*.4,0,7);c.fill();
  const hs=look.hatStyle;c.fillStyle=look.hat;
  if(hs==='cap'){c.beginPath();c.ellipse(s*.42,0,s*.26,s*.33,0,0,7);c.fill();c.beginPath();c.arc(0,0,s*.43,0,7);c.fill();c.stroke();}
  else if(hs==='visor'){c.beginPath();c.ellipse(s*.42,0,s*.26,s*.35,0,0,7);c.fill();c.strokeStyle=look.hat;c.lineWidth=s*.12;c.beginPath();c.arc(0,0,s*.4,-1.9,1.9);c.stroke();}
  else if(hs==='bucket'){c.beginPath();c.arc(0,0,s*.62,0,7);c.fill();c.stroke();c.fillStyle='rgba(0,0,0,.14)';c.beginPath();c.arc(0,0,s*.36,0,7);c.fill();}
  c.restore();
}
/* ---------------- small UI helpers ---------------- */
function modal(html){const m=$('#modal');m.innerHTML='<div class="panel" style="max-width:480px">'+html+'</div>';m.classList.remove('hidden');return m;}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML='';}
const modalOpen=()=>!$('#modal').classList.contains('hidden');
function toast(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f2716;border:1px solid #4b9a5e;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 20px #0008';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
const fmtRel=n=>n===0?'E':n>0?'+'+n:String(n);

/* ---------------- game ---------------- */
const cv=$('#cv'),ctx=cv.getContext('2d');let VW=0,VH=0;
function resize(){const d=window.devicePixelRatio||1;VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*d);cv.height=Math.round(VH*d);ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
let S=null; // the active round, or null when in menus
const mouse={x:0,y:0,moved:false};
const ACC_IN=.1,ACC_OUT=.3; // edges of the centre and light-green accuracy zones, as a fraction of the half-meter
const CAM_UP=100; // how far above screen centre the view sits, to clear the controls at the bottom
let isTouch=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

function startRound(course,idxs,opt){
  opt=opt||{};
  S={course,idxs,i:0,scores:[],practice:!!opt.practice,onDone:opt.onDone,tour:opt.tour,xp:0,coins:0,ups:0};
  $('#ui').classList.add('hidden');$('#hud').classList.remove('hidden');
  startHole();
}
function startHole(){
  const h=S.course.holes[S.idxs[S.i]];S.h=h;S.bmp=holeBitmap(h);
  S.ball={x:h.tee.x,y:h.tee.y,z:0};S.last={x:h.tee.x,y:h.tee.y};S.strokes=0;
  S.wind={a:Math.random()*6.283,mph:Math.round(Math.random()*Math.random()*(h.wind||22))};
  S.state='aim';S.power=0;S.accv=0;S.msg=null;S.after=null;S.cam=null;S.fireT=0;
  S.aim=Math.atan2(h.pin.y-h.tee.y,h.pin.x-h.tee.x);S.gaim=S.aim;mouse.moved=false;
  pickClub();
}
const distPin=()=>Math.hypot(S.h.pin.x-S.ball.x,S.h.pin.y-S.ball.y);
function lie(){const h=S.h,b=S.ball;if(b.x===h.tee.x&&b.y===h.tee.y)return'e';const t=terrainAt(h,b.x,b.y);return(t==='w'||t==='o')?'r':t;}
function allowed(i){const l=lie(),c=CLUBS[i];if(l==='g')return c.cat==='putter';if(c.cat==='driver')return l==='e';return true;}
function shotMax(){const c=CLUBS[S.club];return c.cat==='putter'?S.puttMax:clubMax(c,lie());}
function pickClub(){
  const l=lie(),d=distPin();
  if(l==='g')S.club=11;
  else{let best=10;for(let i=10;i>=0;i--){if(!allowed(i))continue;best=i;if(clubMax(CLUBS[i],l)*(1+CLUBS[i].roll*.6)>=d)break;}S.club=best;}
  S.puttMax=[8,15,30,50].find(v=>v>=d*1.35)||50;
  updateHud();
}
function changeClub(dir){
  if(!S||S.state!=='aim')return;let i=S.club+dir;
  while(i>=0&&i<CLUBS.length&&!allowed(i))i+=dir;
  if(i>=0&&i<CLUBS.length){S.club=i;updateHud();}
}
function updateHud(){
  if(!S)return;const h=S.h,d=distPin(),c=CLUBS[S.club];
  const rel=S.scores.reduce((a,s,i)=>a+s-S.course.holes[S.idxs[i]].par,0);
  const dtxt=(lie()==='g'&&d<20)?Math.round(d*3)+' ft':Math.round(d)+' yd';
  $('#hudTxt').innerHTML=`Hole <b>${S.idxs[S.i]+1}</b> &bull; Par ${h.par} &bull; ${holeYards(h)} yd &bull; Round ${fmtRel(rel)}${S.practice?' &bull; Practice':S.tour!=null?' &bull; Tour event':''}<br>Stroke ${S.strokes+1} &bull; <b>${dtxt}</b> to pin &bull; ${terOf(h,lie()).name}`;
  $('#clubName').innerHTML=`<b>${c.name}</b><span class="small">${c.cat==='putter'?'up to '+S.puttMax+' yd':Math.round(shotMax())+' yd carry'}</span>`;
}
function setMsg(t){S.msg={text:t,t:0};}

function action(){
  if(!S||modalOpen())return;
  if(S.state==='aim'){S.state='power';S.mt=0;S.power=0;}
  else if(S.state==='power'){if(S.power<.04){S.state='aim';return;}S.state='acc';S.mt=0;S.accv=-1;}
  else if(S.state==='acc')fire();
}
function cancelSwing(){if(S&&(S.state==='power'||S.state==='acc')){S.state='aim';S.power=0;}}
function fire(){
  const p=save.profile,club=CLUBS[S.club],l=lie(),put=club.cat==='putter';
  // Accuracy zones on the meter (a = how far from the centre the marker stopped, 0..1):
  //   centre zone  (a < ACC_IN):  dead straight
  //   light zone   (a < ACC_OUT): 2 to 6 degrees off line - with a driver that is the edge of the fairway or the first cut of rough
  //   outside:                    6 up to 22 degrees off line - trees, sand and water come into play
  let v=S.accv;const a=Math.abs(v),perfect=a<ACC_IN,wild=a>=ACC_OUT;
  v=perfect?0:Math.sign(v)*(wild?6+(a-ACC_OUT)/(1-ACC_OUT)*16:2+(a-ACC_IN)/(ACC_OUT-ACC_IN)*4);
  let maxDev;
  if(put)maxDev=.25*Math.max(.3,(1-.035*(p.stats.touch-1))*(1-eq('putter').touch));
  else{const ea=club.cat==='driver'?eq('driver').acc:club.cat==='iron'?eq('irons').acc:eq('wedge').rec*.4;
    const lf=1+(terOf(S.h,l).dev-1)*Math.max(.2,1-.03*(p.stats.recovery-1));
    maxDev=lf*Math.max(.4,(1-.03*(p.stats.accuracy-1))*(1-ea));} // stats and gear shrink every miss, down to 40% of the base
  const noise=(Math.random()-.5)*(put?.5:2)*(perfect?.3:1);
  const ang=S.aim+(v*maxDev+noise)*Math.PI/180,pw=S.power;
  const carryMax=shotMax();
  S.last={x:S.ball.x,y:S.ball.y};S.strokes++;S.shotClub=club;S.puttLen=distPin();S.fireT=performance.now();S.swingBack=pw*2;
  if(put){const sp=Math.sqrt(2*TER.g.decel*pw*S.puttMax);S.vx=Math.cos(ang)*sp;S.vy=Math.sin(ang)*sp;S.state='roll';}
  else{const carry=carryMax*pw,T=1+carry/110;S.fl={t:0,T,apex:club.apex*(.35+.65*pw)};S.vx=Math.cos(ang)*carry/T;S.vy=Math.sin(ang)*carry/T;
    S.tileKey=Math.floor(S.ball.x/TILE)+','+Math.floor(S.ball.y/TILE);S.state='flight';}
  if(perfect)setMsg('Perfect!');else if(wild&&!put)setMsg(v<0?'Pulled left!':'Pushed right!');

}
function penalty(why){
  S.strokes++;S.ball={x:S.last.x,y:S.last.y,z:0};setMsg(why+'  +1 stroke');rest();
}
function rest(){
  S.ball.z=0;S.vx=S.vy=0;
  if(S.strokes>=S.h.par+6){holeDone(true);return;}
  S.state='aim';S.power=0;S.aim=Math.atan2(S.h.pin.y-S.ball.y,S.h.pin.x-S.ball.x);S.gaim=S.aim;mouse.moved=false;
  pickClub();
}
function holeDone(pick){
  const h=S.h,st=S.strokes,diff=st-h.par,ace=st===1&&!pick;
  S.state='holed';S.scores.push(st);
  let xp=ace?250:diff<=-2?120:diff===-1?60:diff===0?30:diff===1?15:6,coins=ace?300:diff<=-2?120:diff===-1?50:diff===0?20:diff===1?10:4;
  const bonus=[];
  if(!pick&&!ace){if(S.shotClub.cat!=='putter'){xp+=25;bonus.push('Chip-in bonus +25 XP');}else if(S.puttLen>10){xp+=10;bonus.push('Long putt bonus +10 XP');}}
  const name=pick?'Picked up':ace?'HOLE IN ONE!':diff<=-3?'Albatross!':diff===-2?'Eagle!':diff===-1?'Birdie!':diff===0?'Par':diff===1?'Bogey':diff===2?'Double Bogey':'+'+diff;
  let ups=0;if(!S.practice){ups=addXp(xp);save.profile.coins+=coins;S.xp+=xp;S.coins+=coins;S.ups+=ups;persist();}
  setMsg(name);
  S.after={t:1.6,fn:()=>{
    const lastH=S.i>=S.idxs.length-1,rel=S.scores.reduce((a,s,i)=>a+s-S.course.holes[S.idxs[i]].par,0);
    modal(`<h2>Hole ${S.idxs[S.i]+1}: ${esc(name)}</h2><p>${st} stroke${st>1?'s':''} on a par ${h.par}${pick?' (stroke limit reached)':''}. Round so far: <b>${fmtRel(rel)}</b></p>`+
      (S.practice?'':`<p>+${xp} XP &nbsp; <span class="coin">+${coins} coins</span></p>`+bonus.map(b=>`<p>${b}</p>`).join('')+(ups?`<p class="under">Level up! You are now level ${save.profile.level} - new stat points to spend.</p>`:''))+
      `<button class="primary big" id="mNext">${lastH?(S.practice?'Back to designer':'Finish round'):'Next hole'}</button>`);
    $('#mNext').onclick=()=>{closeModal();if(lastH)finishRound();else{S.i++;startHole();}};
  }};
}
function leaveRound(){const R=S;S=null;$('#hud').classList.add('hidden');$('#ui').classList.remove('hidden');return R;}
function finishRound(){
  const R=leaveRound();if(R.practice){R.onDone&&R.onDone();return;}
  const full=R.idxs.length===18,p=save.profile;
  const total=R.scores.reduce((a,b)=>a+b,0),par=R.idxs.reduce((a,i)=>a+R.course.holes[i].par,0);
  const bx=full?60:30,bc=(full?50:25)+Math.max(0,par-total)*20;
  const ups=addXp(bx);p.coins+=bc;p.rounds++;R.xp+=bx;R.coins+=bc;R.ups+=ups;
  let best=false;if(full&&(p.best[R.course.id]==null||total<p.best[R.course.id])){p.best[R.course.id]=total;best=true;}
  if(R.tour!=null&&full)tourResult(R,total,par);
  persist();lbSubmit();showCard(R,total,par,best);
}
$('#quitBtn').onclick=()=>{if(!S)return;
  modal(`<h2>Quit this round?</h2><p>XP and coins from finished holes are kept.</p><div class="row"><button id="qy" class="danger">Quit round</button><span class="sp"></span><button id="qn" class="primary">Keep playing</button></div>`);
  $('#qn').onclick=closeModal;$('#qy').onclick=()=>{closeModal();const R=leaveRound();if(R.practice&&R.onDone)R.onDone();else showMenu();};};
$('#clubPrev').onclick=()=>changeClub(-1);$('#clubNext').onclick=()=>changeClub(1);

cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.moved=true;});
cv.addEventListener('pointerdown',e=>{if(!S)return;mouse.x=e.clientX;mouse.y=e.clientY;mouse.moved=true;isTouch=e.pointerType!=='mouse';if(S.state==='aim')aimFromMouse();if(e.button===2){cancelSwing();return;}

$('#swingBtn').onpointerdown=e=>{e.preventDefault();action();};
cv.addEventListener('contextmenu',e=>e.preventDefault());

function aimFromMouse(){
  const b=S.ball;if(mouse.moved&&S.cam){const wx=(mouse.x-VW/2)/S.cam.s+S.cam.x,wy=(mouse.y-VH/2+CAM_UP)/S.cam.s+S.cam.y;if(Math.hypot(wx-b.x,wy-b.y)>.3)S.aim=Math.atan2(wy-b.y,wx-b.x);}
  S.gaim=S.aim;
}
function update(dt){
  const h=S.h,b=S.ball,p=save.profile;
  if(S.msg){S.msg.t+=dt;if(S.msg.t>2.4)S.msg=null;}
  if(S.after&&!modalOpen()){S.after.t-=dt;if(S.after.t<=0){const f=S.after.fn;S.after=null;f();}}
  const put=CLUBS[S.club].cat==='putter';
  if(S.state==='aim'){
    aimFromMouse();
  }else if(S.state==='power'){
    S.mt+=dt;const rise=put?1.25+.03*(p.stats.touch-1)+eq('putter').touch:1.1,ph=(S.mt/rise)%2;S.power=ph<1?ph:2-ph;
    if(S.mt>rise*2){S.state='aim';S.power=0;}
  }else if(S.state==='acc'){
    S.mt+=dt;const sw=put?.8+.02*(p.stats.touch-1)+eq('putter').touch*.8:.7+.02*(p.stats.accuracy-1),ph=(S.mt/sw)%2;S.accv=ph<1?-1+2*ph:3-2*ph;

/* ---------------- tours ----------------
   Each tour is five 18-hole events in order of difficulty. An event is played against a field of computer
   golfers whose scores are rolled when the round ends: mean = strokes over par for an average field golfer,
   sd = spread. Finish in the top TOUR_CUT to qualify and unlock the next event; qualify in all five to
   complete the tour, which unlocks the next tour. */
const TOURS=[
  {name:'Qualifying Tour',flag:'card',prize:[500,200],doneMsg:'Tour Card earned! You qualified in all five events.',
   blurb:'Five events on the standard courses. Qualify in all five to earn your Tour Card.',
   events:[{id:'builtin1',mean:20,sd:4},{id:'builtin3',mean:16,sd:4},{id:'builtin2',mean:13,sd:4},{id:'builtin4',mean:10,sd:3.5},{id:'builtin5',mean:7,sd:3.5}]},
  {name:'Rookie Tour',flag:'rookie',prize:[1000,400],wins:2,doneMsg:'Rookie Tour complete!',
   blurb:'The same five courses set up harder: about 10% longer, narrower fairways, trees standing in the fairway, and more bunkers and water. The fields are stronger and the prizes are doubled. Complete it by qualifying in all five events, or by winning any two.',
   events:[{id:'rookie1',mean:13,sd:3.5},{id:'rookie3',mean:11,sd:3.5},{id:'rookie2',mean:9,sd:3.5},{id:'rookie4',mean:7,sd:3},{id:'rookie5',mean:5,sd:3}]},
  {name:'Pro Tour',flag:'pro',prize:[2500,800],wins:2,doneMsg:'Pro Tour complete! You are the Tour Champion.',
   blurb:'Three new courses built to be hard: a windy mountain course, a fantasy course with rivers of lava, and a finale where every hole is a different world. Prizes are tripled. Complete it by qualifying in all three events, or by winning any two.',
   events:[{id:'pro1',mean:9,sd:3},{id:'pro2',mean:7,sd:3},{id:'pro3',mean:5,sd:3}]}
];
const TOUR_FIELD=['Ace Barlow','Mia Fontaine','Rory Finch','Sam Okafor','Lena Brandt','Tomas Vega','Priya Nair','Gus Halloran','Yuki Mori','Dana Whitlock','Otis Greer'];
const TOUR_CUT=3;
const tourCourse=e=>BUILTIN.concat(ROOKIE,PRO).find(c=>c.id===e.id);
// a tour is complete with a top-TOUR_CUT finish in every event, or (if the tour sets `wins`) that many different events won
const tourWins=(tour,t)=>tour.events.filter(e=>t.pos[e.id]===1).length;
const tourDone=(tour,t)=>tour.events.every(e=>t.pos[e.id]<=TOUR_CUT)||(tour.wins&&tourWins(tour,t)>=tour.wins);
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)/.577;
function tourResult(R,total,par){
  const p=save.profile,tour=TOURS[R.tour.t],ev=tour.events[R.tour.e],t=p.tour||(p.tour={pos:{}}),m=R.tour.t+1;
  const rows=TOUR_FIELD.map((n,i)=>({name:n,score:par+Math.round(ev.mean+(i-5)*.5+ev.sd*gauss())}));
  rows.push({name:p.name,score:total,me:true});
  rows.sort((a,b)=>a.score-b.score||(a.me?-1:b.me?1:0)); // the player wins ties
  const pos=rows.findIndex(r=>r.me)+1,q=pos<=TOUR_CUT;
  let xp=(pos===1?150:q?60:0)*m,coins=(pos===1?300:q?120:0)*m;
  if(t.pos[ev.id]==null||pos<t.pos[ev.id])t.pos[ev.id]=pos;
  let done='';if(!t[tour.flag]&&tourDone(tour,t)){t[tour.flag]=true;done=tour.doneMsg;coins+=tour.prize[0];xp+=tour.prize[1];}
  if(xp){R.ups+=addXp(xp);R.xp+=xp;}p.coins+=coins;R.coins+=coins;
  R.tourRes={rows,pos,q,done};
}
function showTour(){
  const p=save.profile,t=p.tour||{pos:{}},qd=e=>t.pos[e.id]<=TOUR_CUT,last=TOURS[TOURS.length-1];
  UI.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">Tours</h2><span class="sp"></span><button id="tBack">Back</button></div>
  <p>Each event is 18 holes against a field of ${TOUR_FIELD.length} other golfers. Finish in the top ${TOUR_CUT} to qualify and unlock the next event. Winning an event pays a bigger prize.</p>
  ${TOURS.map((tour,ti)=>{const unlocked=ti===0||t[TOURS[ti-1].flag],n=tour.events.filter(qd).length;
    return `<h3>${tour.name} &mdash; ${t[tour.flag]?'complete':unlocked?n+' of '+tour.events.length+' qualified'+(tour.wins?', '+tourWins(tour,t)+' of '+tour.wins+' wins':''):'locked'}</h3><p class="small">${tour.blurb}</p>`+
    (!unlocked?`<div class="card"><div class="small">Locked. Complete the ${TOURS[ti-1].name} first.</div></div>`:
    tour.events.map((e,i)=>{const c=tourCourse(e),open=i===0||qd(tour.events[i-1]),ps=t.pos[e.id];
      return `<div class="card row" style="${qd(e)?'border-color:var(--good)':''}"><div style="flex:1;min-width:180px"><div class="t">Event ${i+1}: ${esc(c.name)}</div><div class="small">Par ${coursePar(c)} &bull; ${courseYards(c)} yd &bull; ${ps?`Best finish: <b>${ord(ps)}</b>${qd(e)?' &mdash; qualified':''}`:open?'Not played yet':'Locked'}</div></div><button data-vh="${ti}:${i}">Holes</button>${open?`<button class="${qd(e)?'':'primary'}" data-ev="${ti}:${i}">${qd(e)?'Play again':'Play event'}</button>`:`<button disabled>Top ${TOUR_CUT} in event ${i} to unlock</button>`}</div>`;}).join(''));}).join('')}
  ${t[last.flag]?'<div class="card" style="border-color:var(--acc);margin-top:16px"><div class="t">Tour Champion</div><div class="small">You have completed every tour. All events stay open to replay.</div></div>':''}</div>`;
  $('#tBack').onclick=showMenu;
  $$('[data-ev]',UI).forEach(b=>b.onclick=()=>{const[ti,i]=b.dataset.ev.split(':').map(Number);startRound(tourCourse(TOURS[ti].events[i]),[...Array(18).keys()],{tour:{t:ti,e:i}});});
  $$('[data-vh]',UI).forEach(b=>b.onclick=()=>{const[ti,i]=b.dataset.vh.split(':').map(Number);showHoles(tourCourse(TOURS[ti].events[i]),0,showTour);});
}

    info();redraw();
  }
  function info(){const pt=terrainAt(h,h.pin.x,h.pin.y);$('#eInfo').innerHTML=`Hole ${hi+1}: ${holeYards(h)} yd tee to pin &bull; course par ${coursePar(course)}`+(pt!=='g'?'<br><span class="over">The pin is not on a green.</span>':'');}
  function paint(e){
    const r=cvs.getBoundingClientRect(),fx=(e.clientX-r.left)/E.zoom,fy=(e.clientY-r.top)/E.zoom,n=h.rows.length;
    if(fx<0||fy<0||fx>=h.cols||fy>=n)return;
    if(E.tool==='tee'||E.tool==='pin'){h[E.tool]={x:Math.round(fx*TILE*2)/2,y:Math.round(fy*TILE*2)/2};}
    else{const rad=E.brush/2,cx=Math.floor(fx),cy=Math.floor(fy);
      for(let y=Math.max(0,Math.floor(fy-rad));y<=Math.min(n-1,Math.ceil(fy+rad));y++){let row=h.rows[y],ch=false;
        for(let x=Math.max(0,Math.floor(fx-rad));x<=Math.min(h.cols-1,Math.ceil(fx+rad));x++)if((x===cx&&y===cy)||(x+.5-fx)**2+(y+.5-fy)**2<=rad*rad){if(row[x]!==E.tool){row=row.slice(0,x)+E.tool+row.slice(x+1);ch=true;}}
        if(ch)h.rows[y]=row;}}
    redraw();
  }
  cvs.onpointerdown=e=>{if(E.tool==='pan')return;E.down=true;cvs.setPointerCapture(e.pointerId);paint(e);};
  cvs.onpointermove=e=>{if(E.down&&E.tool.length===1)paint(e);};
  cvs.onpointerup=cvs.onpointercancel=()=>{if(E.down){E.down=false;persist();info();}};
  $('#eName').oninput=e=>{course.name=e.target.value.trim()||'My Course';persist();};
  $('#ePar').onchange=e=>{h.par=+e.target.value;persist();info();};
  $('#eRows').onchange=e=>{const want=clamp(Math.round((+e.target.value||0)/TILE),20,150),d=want-h.rows.length;
    if(d>0)h.rows=Array.from({length:d},()=>'r'.repeat(h.cols)).concat(h.rows);else if(d<0)h.rows=h.rows.slice(-d);
    const my=h.rows.length*TILE-1;for(const k of['tee','pin'])h[k]={x:h[k].x,y:clamp(h[k].y+d*TILE,1,my)};persist();sync();};
  $('#eBrush').oninput=e=>E.brush=+e.target.value;
  $('#eDir').onchange=$('#eStr').onchange=()=>{h.slope={dir:+$('#eDir').value,str:+$('#eStr').value};persist();};
  $('#eGen').onclick=()=>{course.holes[hi]=genHole(h.par,rng(Math.floor(Math.random()*1e9)),{theme:h.theme});persist();sync();};
  $('#eClear').onclick=()=>{h.rows=h.rows.map(()=>'r'.repeat(h.cols));persist();sync();};
  $('#eZo').onclick=()=>{E.zoom=Math.max(4,E.zoom-2);redraw();};$('#eZi').onclick=()=>{E.zoom=Math.min(24,E.zoom+2);redraw();};
  $('#eTest').onclick=()=>{persist();startRound(course,[hi],{practice:true,onDone:()=>showEditor(course,hi)});};
  $('#eDone').onclick=()=>{persist();showCourses('design');};
  sync();
}

/* ---------------- boot ---------------- */
loadSave();
if(save.profile)showMenu();else showCreate(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
