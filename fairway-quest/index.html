<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fairway Quest</title>
<style>
:root{
  --bg:#0d2315;--panel:rgba(16,42,25,.9);--panel2:rgba(26,64,39,.86);--line:rgba(126,196,140,.28);
  --line-hi:rgba(244,200,82,.55);--txt:#f2f8ef;--dim:#b2cbb5;--acc:#f4c542;--acc2:#ffe380;
  --good:#7ae68d;--bad:#ff8070;--serif:Georgia,"Palatino Linotype","Book Antiqua",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 28%,#235731,#0a1d10);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.hidden{display:none!important}
.panel{background:linear-gradient(165deg,rgba(22,56,34,.94),rgba(12,33,19,.95));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:24px 28px;width:100%;max-width:780px;box-shadow:0 22px 60px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.1);margin:auto}
.panel.wide{max-width:1060px}
h1{margin:0 0 6px;font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:.5px;background:linear-gradient(180deg,#fff3bd 0%,#f4c542 58%,#d1961f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(40,26,0,.75))}
h2{margin:0 0 14px;font-family:var(--serif);font-size:25px;letter-spacing:.2px;color:#f6faf3}
h3{margin:16px 0 8px;font-size:12.5px;color:#d4e5d1;text-transform:uppercase;letter-spacing:1.4px;font-weight:700}
p{color:var(--dim);line-height:1.52;margin:6px 0}
button{font:inherit;color:var(--txt);background:linear-gradient(180deg,rgba(40,94,58,.92),rgba(26,66,40,.95));border:1px solid rgba(132,204,146,.32);border-radius:10px;padding:8px 15px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .1s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
button:hover:not(:disabled){background:linear-gradient(180deg,rgba(52,118,74,.96),rgba(33,82,50,.98));border-color:rgba(164,230,174,.55);box-shadow:0 4px 12px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.18);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.42;cursor:default;box-shadow:none}
button.primary{background:linear-gradient(180deg,#ffe071 0%,#f4c542 52%,#dba21d 100%);color:#261b00;border-color:#ffea9a;font-weight:800;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.6)}
button.primary:hover:not(:disabled){background:linear-gradient(180deg,#ffea96 0%,#fad154 52%,#e5ae28 100%);border-color:#fff3bf;box-shadow:0 6px 18px rgba(244,197,66,.28),inset 0 1px 0 rgba(255,255,255,.75)}
button.danger{background:linear-gradient(180deg,rgba(116,42,34,.85),rgba(82,27,22,.9));border-color:rgba(255,140,126,.45);color:#ffd0c8}
button.danger:hover:not(:disabled){background:linear-gradient(180deg,rgba(145,52,42,.92),rgba(104,35,28,.95));border-color:rgba(255,165,152,.7)}
button.big{display:block;width:100%;padding:13px 16px;font-size:16.5px;font-weight:600;margin:9px 0;border-radius:12px}
.menu-panel{padding:20px 26px}
.menu-panel button.big{padding:11px 16px;font-size:16px;margin:7px 0}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.topbar button,.btn-sm{font-size:12.5px;padding:6px 11px;border-radius:9px}
button.arcade{background:linear-gradient(180deg,rgba(48,64,92,.88),rgba(30,42,64,.92));border-color:rgba(155,188,238,.36);color:#dceaff}
button.arcade:hover:not(:disabled){background:linear-gradient(180deg,rgba(62,84,120,.95),rgba(38,54,84,.96));border-color:rgba(244,197,66,.65);color:#fff}
button.sel{outline:2px solid var(--acc);border-color:var(--acc);background:linear-gradient(180deg,rgba(56,126,78,.98),rgba(36,88,54,.98))}
input[type=text],input[type=number],select{font:inherit;background:rgba(10,27,16,.88);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(32,76,47,.78),rgba(20,52,31,.82));border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin:9px 0;box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.07)}
.card .t{font-weight:700;font-size:16px;color:#f5faf4}
.small{font-size:13px;color:var(--dim)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.45);cursor:pointer;padding:0;box-shadow:inset 0 2px 4px rgba(255,255,255,.32),0 2px 5px rgba(0,0,0,.35)}
.sw.sel{outline:3px solid var(--acc);outline-offset:2px}
.bar{height:11px;background:rgba(8,22,13,.85);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#d89d1c,#f4c542,#fff0a6);border-radius:99px;box-shadow:0 0 10px rgba(244,197,66,.45)}
.stat{display:grid;grid-template-columns:96px 1fr 34px 34px;gap:8px;align-items:center;margin:8px 0}
.pips{display:flex;gap:3px}.pips i{flex:1;height:10px;background:rgba(8,22,13,.8);border-radius:3px;border:1px solid rgba(255,255,255,.05)}.pips i.on{background:linear-gradient(180deg,#a6f7b0,#55cc6c);box-shadow:0 0 6px rgba(122,230,141,.35)}
table.sc{border-collapse:collapse;width:100%;font-size:13px;text-align:center;margin:8px 0;border-radius:10px;overflow:hidden}
table.sc td,table.sc th{border:1px solid var(--line);padding:5px 3px;min-width:26px}
table.sc th{background:rgba(10,27,16,.88);color:var(--dim);font-weight:600}
.under{color:var(--good);font-weight:700}.over{color:var(--bad)}
/* pro shop: wall of shelves with a shopkeeper and counter in front */
.shop{margin-top:12px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 0 1px var(--line);overflow:hidden}
.shop .wall{padding:10px 14px 20px;border-radius:14px 14px 0 0;position:relative}
.shop .wall:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,238,185,.14),transparent 62%);pointer-events:none}
.shop h4{margin:14px 0 2px;font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--lab);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.shelf{display:flex;gap:8px;overflow-x:auto;padding:8px 6px 2px;border-bottom:10px solid var(--shelf);box-shadow:0 8px 10px rgba(0,0,0,.42),inset 0 -2px 0 rgba(255,255,255,.15);scrollbar-width:thin;scrollbar-color:var(--shelf) transparent}
.gear{flex:1 0 80px;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 5px 6px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.28));border:2px solid rgba(255,255,255,.06);border-radius:10px 10px 0 0;color:#fff;font:inherit;cursor:pointer;overflow:hidden;box-shadow:none}
.gear:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(0,0,0,.22));border-color:rgba(255,255,255,.28);transform:translateY(-2px)}
.gear svg{width:48px;height:64px;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.gear .gn{font-size:11.5px;font-weight:700;line-height:1.15;text-align:center;min-height:2.3em}
.gear .gp{font-size:11px;color:var(--lab);font-weight:600}
.gear.on{border-color:var(--acc);box-shadow:0 0 14px rgba(244,197,66,.28)}
.gear.sel{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border-color:#fff}
.gear.lock svg,.gear.lock .gn,.gear.lock .gp{opacity:.45}
.gear .ban{position:absolute;left:-20%;right:-20%;top:24px;transform:rotate(-13deg);background:linear-gradient(180deg,#c93329,#9d1c15);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 0;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.55);border-top:1px solid #ffb4a8;border-bottom:1px solid #6d120d}
.counter{position:sticky;bottom:0;z-index:2}
.cback{display:flex;align-items:flex-end;gap:12px;padding:10px 14px 0;background:var(--back);box-shadow:0 -8px 18px rgba(0,0,0,.4)}
.keeper{width:74px;height:88px;flex:none;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.bubble{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:linear-gradient(180deg,#fffef9,#f4efe0);color:#1c2a1f;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.32)}
.bubble:before{content:"";position:absolute;left:-9px;bottom:18px;border:6px solid transparent;border-right-color:#f9f5e8;border-left:0}
.bubble .bt{flex:1 1 190px;min-width:0}
.bubble .t{font-weight:800;font-size:15px}
.bubble .why{color:#9a281a;font-weight:600}
.ctop{height:28px;background:var(--ctr);border-top:5px solid var(--trim);border-radius:0 0 14px 14px;box-shadow:inset 0 -9px 12px rgba(0,0,0,.32),inset 0 2px 3px rgba(255,255,255,.15)}
.shop0{--shelf:#966d3e;--ctr:repeating-linear-gradient(90deg,#7f5730 0 58px,#6b4623 58px 60px);--trim:#b88952;--lab:#f0dfc4;--back:linear-gradient(180deg,#54402c,#3e2f1f)}
.shop0 .wall{background:#66513d radial-gradient(rgba(0,0,0,.28) 1.5px,transparent 2px) 0 0/14px 14px}
.shop1{--shelf:#c8975d;--ctr:linear-gradient(#b98146,#895626);--trim:#e9c776;--lab:#d2e2f6;--back:linear-gradient(180deg,#182f4a,#102035)}
.shop1 .wall{background:#1b3554 repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px)}
.shop2{--shelf:#d8b340;--ctr:linear-gradient(100deg,#f5f5f8,#cfd1d8 35%,#ffffff 55%,#c2c4cc 80%,#ececf2);--trim:#e4c14e;--lab:#f0dc98;--back:linear-gradient(180deg,#121218,#09090d)}
.shop2 .wall{background:#15151b repeating-linear-gradient(90deg,rgba(216,179,64,.16) 0 1px,transparent 1px 40px)}
.tag{display:inline-block;background:rgba(10,27,16,.84);border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:#cfe3cf;margin-right:6px}
.coin{color:var(--acc);font-weight:700}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>div{position:absolute;background:linear-gradient(180deg,rgba(14,38,22,.88),rgba(9,26,15,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(140,210,152,.3);border-radius:13px;padding:8px 12px;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.1)}
#hud #hudQuit{left:10px;top:10px;padding:0;border:none;background:none;box-shadow:none;backdrop-filter:none;display:flex;gap:6px}
#hudQuit button{padding:6px 11px;font-size:12.5px;background:rgba(12,34,19,.86);backdrop-filter:blur(8px);border-radius:10px}
#hud #hudClub{left:50%;bottom:154px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;width:max-content;max-width:calc(100vw - 12px);padding:6px 12px}
#hudClub button{padding:4px 12px;font-size:13px;border-radius:8px}
#hud #hudClub .nm{min-width:176px}#hud #hudClub .nm b{display:inline;font-size:15.5px;margin-right:6px;color:#fff}
#hud #hudSwing{left:50%;bottom:12px;transform:translateX(-50%);padding:0;border:none;background:none;box-shadow:none;backdrop-filter:none}
#hud #swingBtn{width:min(352px,calc(100vw - 16px));height:62px;font-size:23px;letter-spacing:1.2px;border-width:2px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.48),0 0 0 1px rgba(255,235,150,.35);white-space:nowrap}
#hudTxt{font-size:12px;line-height:1.45;color:var(--dim);text-align:center}
#hudTxt b{color:var(--acc)}
.lieDot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid rgba(255,255,255,.55)}
.clubRow{display:flex;gap:10px;align-items:center;justify-content:center}
table.lb{border-collapse:collapse;width:100%;margin:10px 0}
table.lb td,table.lb th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
table.lb th{color:var(--dim);font-weight:600;font-size:13px}
table.lb td:first-child,table.lb th:first-child{width:44px;color:var(--dim)}
table.lb td:last-child,table.lb th:last-child{text-align:right}
table.lb tr.me td{background:rgba(52,126,76,.55);color:var(--txt);font-weight:700}
#hudClub .nm{min-width:155px;text-align:center}
#hudClub .nm b{display:block;font-size:17px}
canvas#cv{touch-action:none}
html{touch-action:manipulation}
@media(max-width:1000px){#hudHelp{display:none}}
@media(max-width:700px){
  #hudTxt{font-size:11px}#hud #hudClub button{padding:6px 14px}
  .card .row>div:first-child{min-width:100%}
  #ui{padding:10px 8px}.panel{padding:16px 14px}h1{font-size:34px}h2{font-size:21px}
  #ui #ed{flex-direction:column;height:auto}#ui #edSide{width:100%;overflow:visible}#ui #edMain{order:-1;position:sticky;top:0;z-index:2;height:50vh;flex:none;padding:8px}
}
#hudHelp{left:12px;bottom:12px;font-size:11.5px;color:var(--dim);max-width:255px;line-height:1.45}
#modal{position:fixed;inset:0;background:rgba(5,16,9,.62);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
/* editor */
#ed{display:flex;gap:14px;width:100%;height:calc(100vh - 48px);max-width:1300px;margin:0 auto}
#edSide{width:300px;flex:none;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:14px}
#edMain{flex:1;overflow:auto;background:#0a1d11;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
#edCv{cursor:crosshair;image-rendering:pixelated;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.holes button{padding:5px 0;font-size:13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tools button{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:13px;text-align:left}
.tools i{width:16px;height:16px;border-radius:4px;border:1px solid #0008;flex:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="hudQuit"><button id="quitBtn">&#8592; Main menu</button><button id="arcadeHudBtn" class="arcade">&#8592; Arcade</button><button id="muteBtn" title="Toggle sound">&#128266;</button></div>
  <div id="hudClub"><div id="hudTxt"></div><div class="clubRow"><button id="clubPrev" title="Q">&#9664;</button><div class="nm" id="clubName"></div><button id="clubNext" title="E">&#9654;</button></div></div>
  <div id="hudSwing"><button id="swingBtn" class="primary">Swing</button></div>
  <div id="hudHelp">Click or drag on the course to aim (arrow keys fine-tune) &bull; Swing button / Space: start swing, set power, set accuracy &bull; Q / E or wheel: change club &bull; Esc: cancel swing</div>
</div>
<div id="ui"></div>
<div id="modal" class="hidden"></div>
<script>
'use strict';
/* ============================================================
   FAIRWAY QUEST - top-down golf RPG with an 18-hole course designer
   ============================================================ */
const TILE=5;   // yards per tile
const PPY=6;    // bitmap pixels per yard (high-res illustrated rendering)
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- data ---------------- */
const TER={
  r:{name:'Rough',  col:'#3d8b3a',decel:32, dist:.78,dev:1.50,roll:.42},
  f:{name:'Fairway',col:'#5db54c',decel:11, dist:1,  dev:1,   roll:1},
  e:{name:'Tee box',col:'#74cc60',decel:11, dist:1,  dev:1,   roll:1},
  g:{name:'Green',  col:'#8ee076',decel:5.5,dist:1,  dev:1,   roll:.9},
  s:{name:'Bunker', col:'#ead9a0',decel:74, dist:.62,dev:1.72,roll:.08},
  w:{name:'Water',  col:'#3b8fd6',decel:99, dist:1,  dev:1,   roll:0},
  t:{name:'Trees',  col:'#1f5c2b',decel:48, dist:.50,dev:1.95,roll:.25},
  o:{name:'Out of bounds',col:'#0d2414',decel:99,dist:1,dev:1,roll:0}
};
// desert courses reuse the same tiles, but "rough" is open desert and "trees" are cactus and rocks
const DESERT={
  r:{name:'Desert', col:'#d9a868',decel:40,dist:.73,dev:1.55,roll:.35},
  t:{name:'Cactus & rocks',col:'#b98452',decel:62,dist:.46,dev:2.0,roll:.18},
  s:{name:'Bunker', col:'#f7eed6',decel:74,dist:.62,dev:1.72,roll:.08}
};
// tropical courses: each hole is an island - beach sand, then ocean, with palms instead of trees
const TROPIC={
  r:{name:'Rough', col:'#2f9a4c',decel:32,dist:.78,dev:1.50,roll:.42},
  t:{name:'Palms', col:'#1f7a3d',decel:48,dist:.54,dev:1.85,roll:.25},
  s:{name:'Sand',  col:'#fbf1d0',decel:74,dist:.62,dev:1.72,roll:.08},
  w:{name:'Ocean', col:'#27b3c9',decel:99,dist:1,  dev:1,   roll:0}
};
// mountain courses: pine forest and rock, grey scree instead of sand, and stronger wind
const MOUNTAIN={
  r:{name:'Alpine rough',col:'#4b8b5e',decel:34,dist:.76,dev:1.55,roll:.40},
  t:{name:'Pines',col:'#2c5b45',decel:48,dist:.50,dev:1.95,roll:.25},
  s:{name:'Scree',col:'#d2ccba',decel:74,dist:.60,dev:1.75,roll:.08},
  w:{name:'Lake',col:'#2f74c0',decel:99,dist:1,dev:1,roll:0}
};
// fantasy courses: purple moss, teal fairways, mushrooms and crystals, and lava where the water would be
const FANTASY={
  r:{name:'Moss',col:'#6a4d9e',decel:32,dist:.78,dev:1.50,roll:.42},
  f:Object.assign({},TER.f,{col:'#35c4a4'}),e:Object.assign({},TER.e,{col:'#5fe0c0'}),g:Object.assign({},TER.g,{col:'#a8f7de'}),
  t:{name:'Mushrooms',col:'#4b3380',decel:48,dist:.50,dev:1.95,roll:.25},
  s:{name:'Stardust',col:'#f7bfe8',decel:74,dist:.62,dev:1.72,roll:.08},
  w:{name:'Lava',col:'#ff6a1f',decel:99,dist:1,dev:1,roll:0}
};
const THEME_TER={desert:DESERT,tropical:TROPIC,mountain:MOUNTAIN,fantasy:FANTASY};
const waterMsg=h=>{const n=terOf(h,'w').name;return n==='Water'?'Water hazard!':'In the '+n.toLowerCase()+'!';};
const terOf=(h,ch)=>(h&&THEME_TER[h.theme]&&THEME_TER[h.theme][ch])||TER[ch];
const PAINTABLE=['r','f','g','s','w','t','e'];
const CLUBS=[
  {id:'DR',name:'Driver', dist:230,apex:28,roll:.22,cat:'driver'},
  {id:'3W',name:'3 Wood', dist:205,apex:26,roll:.20,cat:'iron'},
  {id:'5W',name:'5 Wood', dist:188,apex:27,roll:.18,cat:'iron'},
  {id:'4I',name:'4 Iron', dist:172,apex:24,roll:.16,cat:'iron'},
  {id:'5I',name:'5 Iron', dist:162,apex:25,roll:.15,cat:'iron'},
  {id:'6I',name:'6 Iron', dist:152,apex:26,roll:.13,cat:'iron'},
  {id:'7I',name:'7 Iron', dist:141,apex:27,roll:.11,cat:'iron'},
  {id:'8I',name:'8 Iron', dist:129,apex:28,roll:.09,cat:'iron'},
  {id:'9I',name:'9 Iron', dist:116,apex:29,roll:.07,cat:'iron'},

function clubMax(club,lie){ // full-power carry in yards from a given lie

function terrainAt(h,x,y){const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(ty<0||ty>=h.rows.length||tx<0||tx>=h.cols)return'o';return h.rows[ty][tx];}

function genHole(par,R,opt){
  opt=opt||{};const cols=48;
  const len=(par===3?130+R()*80:par===4?325+R()*115:485+R()*75)*(opt.hard?1.1:1);
  const rows=Math.round(len/TILE)+16;
  const g=[];for(let y=0;y<rows;y++)g.push(new Array(cols).fill('r'));
  // angled starts & sharper doglegs across wider corridor
  const tee={x:9+R()*30,y:rows-5};
  const grn={x:clamp(cols-tee.x+(R()-.5)*22,9,cols-9),y:7.5};
  let pts=[tee];const nMid=par===3?0:par===4?1:2;
  const bendDir=R()<.5?-1:1;
  for(let i=1;i<=nMid;i++){
    const f=i/(nMid+1),sd=i%2?bendDir:-bendDir;
    const swing=(par===4?10+R()*11:9+R()*11)*sd;
    pts.push({x:clamp(lerp(tee.x,grn.x,f)+swing,9,cols-9),y:lerp(tee.y,grn.y,f)});
  }
  pts.push(grn);
  for(let k=0;k<2;k++){const n=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];n.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75});}n.push(pts[pts.length-1]);pts=n;}
  const path=[];let d=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/.5));
    for(let j=0;j<n;j++){const t=j/n;path.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),d:d+L*t});}d+=L;}
  path.push({x:grn.x,y:grn.y,d});const total=d;
  const at=dd=>{let i=0;while(i<path.length-1&&path[i].d<dd)i++;const p=path[i],q=path[Math.min(path.length-1,i+2)],o=path[Math.max(0,i-2)];
    const dx=q.x-o.x,dy=q.y-o.y,L=Math.hypot(dx,dy)||1;return{x:p.x,y:p.y,nx:-dy/L,ny:dx/L};};
  const disc=(cx,cy,rx,ry,ch,ok)=>{for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
    if(y<0||y>=rows||x<0||x>=cols)continue;const ex=(x+.5-cx)/rx,ey=(y+.5-cy)/ry;if(ex*ex+ey*ey<=1&&ok.includes(g[y][x]))g[y][x]=ch;}};
  const creek=(x1,y1,x2,y2,hw,ok)=>{const L=Math.hypot(x2-x1,y2-y1),steps=Math.max(4,Math.ceil(L*2));
    for(let i=0;i<=steps;i++){const t=i/steps;disc(lerp(x1,x2,t),lerp(y1,y2,t),hw,hw,'w',ok);}};
  const rx=2.5+R()*.9,ry=2.5+R()*.9,fw=2.5+R()*.85-(opt.hard?.35:0),ph=R()*6.28;
  // fairway (with occasional split-fairway landing zone on par 4/5)
  const startD=par===3?total*.62:9;
  for(const p of path){if(p.d<startD||p.d>total-ry)continue;const r=fw+.55*Math.sin(p.d*.15+ph);disc(p.x,p.y,r,r,'f','r');}
  const hasSplit=par>3&&R()<.35;
  if(hasSplit){
    const sp=at(total*(.44+R()*.14));
    disc(sp.x,sp.y,fw+2.4,3.8,'f','r');
  }
  // green
  const gph=R()*6.28;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ex=(x+.5-grn.x)/rx,ey=(y+.5-grn.y)/ry,th=Math.atan2(ey,ex),rr=1+.14*Math.sin(3*th+gph);if(ex*ex+ey*ey<=rr*rr)g[y][x]='g';}
  // tee box
  const tx=Math.floor(tee.x),ty=Math.floor(tee.y);
  for(let y=ty-1;y<=ty;y++)for(let x=tx-1;x<=tx;x++)g[y][x]='e';
  // greenside bunkers (guarding approach & flanks)
  for(let i=0,n=2+Math.floor(R()*2);i<n;i++){const a=R()*6.28,r=1.15+R()*.7;disc(grn.x+Math.cos(a)*(rx+1.6),grn.y+Math.sin(a)*(ry+1.6),r*1.2,r,'s','rf');}
  // fairway bunkers
  if(par>3)for(let i=0,n=1+Math.floor(R()*3);i<n;i++){const p=at(total*(.32+R()*.44)),sd=R()<.5?-1:1,r=1.15+R()*.85;disc(p.x+p.nx*sd*(fw+1.1),p.y+p.ny*sd*(fw+1.1),r,r*1.3,'s','rf');}
  // water: angled ponds, corner lakes, or diagonal creeks
  if(R()<(opt.water==null?.5:opt.water)){const r=2.5+R()*2;
    if(par===3){const p=at(total*(.32+R()*.25));disc(p.x+(R()-.5)*3,p.y,r*1.7,r*.95,'w','rfs');}
    else if(R()<.35){ // diagonal creek across fairway
      const p=at(total*(.46+R()*.22)),ang=Math.atan2(p.ny,p.nx)+(R()-.5)*.7;
      creek(p.x-Math.cos(ang)*10,p.y-Math.sin(ang)*10,p.x+Math.cos(ang)*10,p.y+Math.sin(ang)*10,1.0+R()*.3,'rfs');
    }else{const p=at(total*(.32+R()*.48)),sd=R()<.5?-1:1;disc(p.x+p.nx*sd*(fw+r-.7),p.y+p.ny*sd*(fw+r-.7),r,r*1.4,'w','rfs');}}
  // split-fairway island hazard (pond, bunker or sentinel tree cluster)
  if(hasSplit){
    const sp=at(total*.5);
    const kind=R()<.4?'t':R()<.75?'s':'w';
    disc(sp.x,sp.y,kind==='w'?1.6:1.2,kind==='w'?1.9:1.4,kind,'f');
  }else if(par>3&&R()<.55){
    // strategic sentinel tree guarding the inside of a dogleg or approach
    const cp=at(total*(.42+R()*.24)),sd=R()<.5?-1:1;

  }
  // hard set-up: extra bunkers, trees standing in the fairway, and a pond if the hole has no water.
  if(opt.hard){const R2=rng(Math.round(len*7)+par*101);
    for(let i=0,n=par===3?2:3;i<n;i++){
      if(i===0||par===3){const a=R2()*6.28,r=1.1+R2()*.5;disc(grn.x+Math.cos(a)*(rx+1.6),grn.y+Math.sin(a)*(ry+1.6),r,r,'s','rf');}
      else{const p=at(total*(.3+R2()*.45)),sd=R2()<.5?-1:1,r=1.2+R2()*.6;disc(p.x+p.nx*sd*(fw+1.2),p.y+p.ny*sd*(fw+1.2),r,r*1.3,'s','rf');}}
    if(par>3){
      for(let i=0;i<par-3;i++){const p=at(total*(.45+i*.22+R2()*.1)),sd=R2()<.5?-1:1,o=.8+R2();disc(p.x+p.nx*sd*o,p.y+p.ny*sd*o,1,1.2,'t','f');}
      if(!g.some(r=>r.includes('w'))){const p=at(total*(.35+R2()*.4)),sd=R2()<.5?-1:1,r=2.6+R2();disc(p.x+p.nx*sd*(fw+r-.4),p.y+p.ny*sd*(fw+r-.4),r,r*1.3,'w','rfs');}}
  }
  // trees
  const p1=R()*6.28,p2=R()*6.28;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(g[y][x]!=='r')continue;let m=1e9;
    for(let i=0;i<path.length;i+=2){const q=path[i],dd=(q.x-x-.5)**2+(q.y-y-.5)**2;if(dd<m)m=dd;}m=Math.sqrt(m);
    const thr=8.5+1.3*(Math.sin(x*.7+p1)+Math.sin(y*.45+p2));
    if((opt.theme==='desert'||opt.theme==='fantasy')?((m>thr-3&&R()<.22)||(m>4&&R()<.045)):(m>thr||((x<1||x>cols-2)&&R()<.7)||(m>4.8&&R()<.055)))g[y][x]='t';}

}

/* ---------------- hand-designed holes ----------------
   Coordinates are yards: x = 0..200 across (100 is the middle, padded out to 250 yd wide), up = yards from the tee toward the green.
   path: centre line of the hole, tee first, green last.  altPath: optional secondary fairway route (split fairways).
   sand / water / fairway / trees / fwTrees / clear: [x, up, radiusX, radiusY] patches.  creek: [x1, up1, x2, up2, halfWidth] diagonal waterways. */
function buildHole(s){
  const cols=s.cols||50,OX=(cols*TILE-200)/2,R=rng(s.seed||7),end=s.path[s.path.length-1],TP=s.theme==='tropical',rows=Math.round(end[1]/TILE)+(TP?23:13),teeRow=rows-(TP?11:5);
  const P=(x,up)=>({x:(x+OX)/TILE,y:teeRow-up/TILE});
  const g=[];for(let y=0;y<rows;y++)g.push(new Array(cols).fill('r'));
  const smoothPath=raw=>{
    let pts=raw.map(p=>P(p[0],p[1]));
    for(let k=0;k<2;k++){const n=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];n.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75});}n.push(pts[pts.length-1]);pts=n;}
    const out=[];let d=0;
    for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/.5));
      for(let j=0;j<n;j++){const t=j/n;out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),d:d+L*t});}d+=L;}
    const last=pts[pts.length-1];out.push({x:last.x,y:last.y,d});return{pts,path:out,d};
  };
  const main=smoothPath(s.path),pts=main.pts,path=main.path,d=main.d,grn=pts[pts.length-1];
  const alt=s.altPath?smoothPath(s.altPath):null;
  const allPath=alt?path.concat(alt.path):path;
  const disc=(cx,cy,rx,ry,ch,ok)=>{for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
    if(y<0||y>=rows||x<0||x>=cols)continue;const ex=(x+.5-cx)/rx,ey=(y+.5-cy)/ry;if(ex*ex+ey*ey<=1&&ok.includes(g[y][x]))g[y][x]=ch;}};
  const patch=(list,ch,ok)=>(list||[]).forEach(q=>{const c=P(q[0],q[1]);disc(c.x,c.y,q[2]/TILE,(q[3]||q[2])/TILE,ch,ok);});
  const gr=s.green||[14.5,13.5],grx=gr[0]/TILE,gry=gr[1]/TILE,fw=(s.fw||15)/TILE,fs=(s.fwStart==null?50:s.fwStart)/TILE,ph=R()*6.28;
  for(const p of path){if(p.d<fs||p.d>d-gry)continue;const r=fw+.4*Math.sin(p.d*.15+ph);disc(p.x,p.y,r,r,'f','r');}
  if(alt){const afw=Math.max(2.1,fw*.82);for(const p of alt.path){if(p.d<fs*.8||p.d>alt.d-gry)continue;disc(p.x,p.y,afw,afw,'f','r');}}
  patch(s.fairway,'f','r');patch(s.water,'w','rf');
  // diagonal creeks / channels
  (s.creek||[]).forEach(q=>{
    const a=P(q[0],q[1]),b=P(q[2],q[3]),hw=(q[4]||5.5)/TILE,L=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(4,Math.ceil(L*2.5));
    for(let i=0;i<=steps;i++){const t=i/steps;disc(lerp(a.x,b.x,t),lerp(a.y,b.y,t),hw,hw,'w','rf');}
  });
  patch(s.sand,'s','rf');
  const gph=s.gph==null?R()*6.28:s.gph;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ex=(x+.5-grn.x)/grx,ey=(y+.5-grn.y)/gry,th=Math.atan2(ey,ex),rr=1+.12*Math.sin(3*th+gph);if(ex*ex+ey*ey<=rr*rr)g[y][x]='g';}
  const tx=Math.floor(pts[0].x),ty=teeRow;

   standing in the fairway, extra bunkers, and a pond on holes that had no water. */
// lvl 1 = Rookie Tour, lvl 2 = Pro Tour (narrower still, with one more bunker and one more fairway tree per hole)
function toughSpec(s,i,lvl){
  lvl=lvl||1;const pro=lvl>1;
  const R=rng(7000+i*31+s.path.length*13),K=1.1,up=v=>Math.round(v*K),sc=l=>(l||[]).map(q=>[q[0],up(q[1]),q[2],q[3]]);
  const scCr=l=>(l||[]).map(q=>[q[0],up(q[1]),q[2],up(q[3]),q[4]]);
  const dGap={desert:29,tropical:34,fantasy:33}[s.theme]||41,fw=Math.max(11,(s.fw||15)-(pro?2.5:1.8));
  const t=Object.assign({},s,{path:s.path.map(p=>[p[0],up(p[1])]),altPath:s.altPath?s.altPath.map(p=>[p[0],up(p[1])]):undefined,
    sand:sc(s.sand),water:sc(s.water),creek:scCr(s.creek),trees:sc(s.trees),fairway:sc(s.fairway),clear:sc(s.clear),
    fwTrees:sc(s.fwTrees),fw,gap:Math.max(24,(s.gap||dGap)-(pro?7:5)),seed:(s.seed||7)+500});
  if(s.fwStart!=null)t.fwStart=up(s.fwStart);
  const P=t.path,segs=[];let L=0;for(let k=0;k<P.length-1;k++){const l=Math.hypot(P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]);segs.push(l);L+=l;}
  const at=f=>{let d=f*L,k=0;while(k<segs.length-1&&d>segs[k]){d-=segs[k];k++;}const a=P[k],b=P[k+1],q=d/segs[k],dx=b[0]-a[0],du=b[1]-a[1],l=Math.hypot(dx,du)||1;
    return{x:lerp(a[0],b[0],q),u:lerp(a[1],b[1],q),nx:du/l,nu:-dx/l};};
  const side=()=>R()<.5?-1:1,cx=v=>clamp(v,14,186),end=P[P.length-1],gr=s.green||[14.5,13.5];
  for(let n=(s.par===3?2:1)+(pro?1:0),k=0;k<n;k++){const a=R()*6.28;t.sand.push([cx(end[0]+Math.cos(a)*(gr[0]+9)),end[1]+Math.sin(a)*(gr[1]+9),7,7]);}
  if(s.par===3){const p=at(.62),sd=side();t.fwTrees.push([cx(p.x+p.nx*sd*13),p.u+p.nu*sd*13,5,6]);}
  else{
    for(let k=0,n=pro?3:2;k<n;k++){const p=at(pro?.25+k*.2+R()*.12:.3+k*.25+R()*.15),sd=side(),o=fw+8;t.sand.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,8,11]);}
    for(let k=0,n=s.par-3+(pro?1:0);k<n;k++){const p=at(pro?.4+k*.18+R()*.08:.46+k*.22+R()*.08),sd=side(),o=4+R()*5;t.fwTrees.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,5,6]);}
    if(!(s.water&&s.water.length)&&!(s.creek&&s.creek.length)&&s.theme!=='tropical'){const p=at(.36+R()*.36),sd=side(),r=13+R()*4,o=fw+r-1;t.water.push([cx(p.x+p.nx*sd*o),p.u+p.nu*sd*o,r,r*1.35]);}
  }
  return t;
}

/* ---------------- Web Audio sound effects ---------------- */
const SFX=(()=>{
  let ac=null,muted=false;
  try{muted=localStorage.getItem('fairway_quest_muted')==='1';}catch(e){}
  function ensure(){
    if(muted)return null;
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    return ac;
  }
  function noiseBuf(a,dur){
    const n=Math.max(1,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    return b;
  }
  function tone(a,type,f0,f1,dur,vol,delay){
    const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(a,dur,freq,q,vol,delay,type){
    const t=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=noiseBuf(a,dur);f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(q)f.Q.value=q;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+0.02);
  }
  return{
    get muted(){return muted;},
    toggle(){muted=!muted;try{localStorage.setItem('fairway_quest_muted',muted?'1':'0');}catch(e){}if(!muted)this.ui();return muted;},
    ui(){const a=ensure();if(!a)return;tone(a,'triangle',520,660,.055,.06);},
    club(){const a=ensure();if(!a)return;tone(a,'triangle',340,480,.045,.05);tone(a,'sine',820,620,.04,.03,.02);},
    swing(cat,lie,pw,perfect){
      const a=ensure();if(!a)return;
      const v=clamp(.45+pw*.55,.35,1);
      if(cat==='putter'){
        tone(a,'sine',280,140,.06,.16*v);tone(a,'triangle',920,420,.035,.07*v);
      }else if(cat==='driver'){
        noise(a,.16,900,.9,.13*v); // whoosh
        tone(a,'triangle',190,70,.09,.24*v,.02);
        tone(a,'sine',1480,1180,.13,.13*v,.02); // titanium ping
        tone(a,'sine',2350,1900,.09,.07*v,.02);
      }else{
        noise(a,.13,1300,1.1,.14*v);
        tone(a,'triangle',240,85,.08,.2*v,.015);
        tone(a,'sine',1050,620,.07,.09*v,.015);
      }
      if(lie==='s')noise(a,.28,1600,.6,.16*v,.02,'bandpass');
      if(perfect){tone(a,'sine',880,1320,.18,.08,.03);tone(a,'sine',1320,1760,.22,.06,.07);}
    },
    bounce(ter){
      const a=ensure();if(!a)return;
      if(ter==='s'){noise(a,.14,900,.8,.11,0,'lowpass');tone(a,'sine',130,65,.07,.08);}
      else if(ter==='g'){tone(a,'sine',240,120,.055,.09);tone(a,'triangle',540,260,.03,.04);}
      else{tone(a,'sine',175,80,.07,.1);noise(a,.08,700,1,.06);}
    },
    tree(){const a=ensure();if(!a)return;tone(a,'triangle',190,72,.09,.22);tone(a,'square',120,55,.05,.07);noise(a,.22,2200,.7,.11,.02,'bandpass');},
    splash(lava){
      const a=ensure();if(!a)return;
      if(lava){noise(a,.45,2600,.5,.16,0,'highpass');tone(a,'sawtooth',140,55,.32,.12);}
      else{noise(a,.36,1100,.8,.22,0,'bandpass');tone(a,'sine',320,680,.1,.09,.04);tone(a,'sine',440,860,.09,.06,.11);}
    },
    cup(){
      const a=ensure();if(!a)return;
      tone(a,'triangle',680,420,.05,.15,0);
      tone(a,'sine',980,740,.06,.14,.055);
      tone(a,'triangle',520,310,.08,.12,.11);
      tone(a,'sine',1280,1040,.09,.08,.14);
    },
    lipOut(){
      const a=ensure();if(!a)return;
      tone(a,'triangle',860,520,.055,.14,0);
      tone(a,'sine',640,390,.065,.1,.045);
    },
    cheer(kind){
      const a=ensure();if(!a)return;
      const seq=kind==='ace'?[523,659,784,1047,1319]:kind==='eagle'?[523,659,784,1047]:kind==='birdie'?[523,659,784]:[440,554,659];
      seq.forEach((f,i)=>tone(a,'triangle',f,f*1.01,.34,.09,i*.075+.16));
      if(kind==='ace'||kind==='eagle')noise(a,.75,1400,.6,.07,.22,'bandpass');
    },
    buy(){const a=ensure();if(!a)return;tone(a,'sine',880,1175,.11,.1,0);tone(a,'sine',1175,1568,.18,.1,.07);}
  };
})();

const TEX_CACHE={};
function makeGroundPattern(theme,mode){
  const key=(theme||'park')+':'+mode;
  if(TEX_CACHE[key])return TEX_CACHE[key];
  const sz=160,c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');
  const R=rng(key.split('').reduce((a,ch)=>a*33+ch.charCodeAt(0),5381));
  const D=theme==='desert',TR=theme==='tropical',MT=theme==='mountain',FA=theme==='fantasy';
  if(mode==='outer'){
    // helper to draw seamlessly across tile wrap boundaries
    const wrap=(fn)=>{for(const ox of[-sz,0,sz])for(const oy of[-sz,0,sz])fn(ox,oy);};
    if(D){
      g.fillStyle='#c99457';g.fillRect(0,0,sz,sz);
      for(let i=0;i<60;i++){const x=R()*sz,y=R()*sz,rx=14+R()*20,ry=4+R()*6,col=R()<.5?'rgba(115,66,22,.16)':'rgba(255,232,185,.15)';wrap((ox,oy)=>{g.fillStyle=col;g.beginPath();g.ellipse(x+ox,y+oy,rx,ry,.2,0,7);g.fill();});}
      for(let i=0;i<240;i++){g.fillStyle=R()<.5?'rgba(105,60,18,.2)':'rgba(255,240,200,.18)';g.fillRect(R()*sz,R()*sz,2,2);}
    }else if(TR){
      g.fillStyle='#1690ad';g.fillRect(0,0,sz,sz);
      for(let i=0;i<28;i++){const x=R()*sz,y=R()*sz,rx=18+R()*22,ry=6+R()*8,col=R()<.5?'rgba(12,96,120,.22)':'rgba(85,222,232,.14)';wrap((ox,oy)=>{g.fillStyle=col;g.beginPath();g.ellipse(x+ox,y+oy,rx,ry,0,0,7);g.fill();});}
      g.strokeStyle='rgba(235,252,255,.24)';g.lineWidth=1.6;
      for(let i=0;i<16;i++){const x=R()*sz,y=R()*sz;wrap((ox,oy)=>{g.beginPath();g.moveTo(x+ox,y+oy);g.quadraticCurveTo(x+ox+9,y+oy-3.5,x+ox+18,y+oy);g.stroke();});}

function drawTreeCluster(m,x,y,r,pal,ang,R){
  const lobes=4+(R()<.5?1:0);

  m.fillStyle=pal[2];m.beginPath();m.arc(x+r*.08,y+r*.1,r*.94,0,7);m.fill();
  for(let i=0;i<lobes;i++){
    const a=ang+i*(6.283/lobes)+(R()-.5)*.45,dist=r*(.28+R()*.22),lr=r*(.52+R()*.18);
    const lx=x+Math.cos(a)*dist,ly=y+Math.sin(a)*dist;
    const gr=m.createRadialGradient(lx-lr*.35,ly-lr*.35,lr*.1,lx,ly,lr);
    gr.addColorStop(0,pal[0]);gr.addColorStop(.68,pal[1]);gr.addColorStop(1,pal[2]);
    m.fillStyle=gr;m.beginPath();m.arc(lx,ly,lr,0,7);m.fill();
  }
  // sunlit upper-left crown highlight
  const cr=m.createRadialGradient(x-r*.34,y-r*.34,r*.06,x-r*.16,y-r*.16,r*.64);
  cr.addColorStop(0,pal[3]);cr.addColorStop(.7,'rgba(255,255,255,0)');

}

        m.fillStyle='rgba(255,252,245,.9)';
        for(let i=0;i<5;i++){const a=q.a+i*1.257;m.beginPath();m.arc(q.x+Math.cos(a)*q.r*.55,q.y+Math.sin(a)*q.r*.55,q.r*.15,0,7);m.fill();}
        m.beginPath();m.arc(q.x-q.r*.1,q.y-q.r*.1,q.r*.2,0,7);m.fill();
      }else{ // luminous faceted crystal cluster
        const aura=m.createRadialGradient(q.x,q.y,q.r*.2,q.x,q.y,q.r*1.7);aura.addColorStop(0,'rgba(120,248,255,.35)');aura.addColorStop(1,'rgba(0,0,0,0)');
        m.fillStyle=aura;m.beginPath();m.arc(q.x,q.y,q.r*1.7,0,7);m.fill();
        for(let j=0;j<2;j++){
          const ang=q.a+j*1.1,sz=q.r*(j===0?1.1:.78);
          m.fillStyle=j===0?'#6ce8ff':'#b89cff';m.strokeStyle='#1f638d';m.lineWidth=1.2*sc;
          m.beginPath();for(let i=0;i<4;i++){const a=ang+i*Math.PI/2,rr=sz*(i%2?.48:1.05);m.lineTo(q.x+Math.cos(a)*rr,q.y+Math.sin(a)*rr);}m.closePath();m.fill();m.stroke();
        }
        m.fillStyle='rgba(255,255,255,.92)';m.beginPath();m.arc(q.x-q.r*.16,q.y-q.r*.16,q.r*.18,0,7);m.fill();
      }
      continue;
    }
    if(TR){ // lush layered coconut palm
      const fronds=9;
      for(let i=0;i<fronds;i++){
        const a=q.a+i*(6.283/fronds),len=q.r*(.95+(i%2?.12:-.06));
        m.save();m.translate(q.x,q.y);m.rotate(a);
        const fg=m.createLinearGradient(0,0,len,0);fg.addColorStop(0,'#1e7037');fg.addColorStop(.55,i%2?'#36ad54':'#4ec968');fg.addColorStop(1,'#7fe07a');
        m.fillStyle=fg;m.strokeStyle='#144e25';m.lineWidth=.9*sc;
        m.beginPath();m.moveTo(0,0);m.quadraticCurveTo(len*.5,-q.r*.26,len,0);m.quadraticCurveTo(len*.5,q.r*.26,0,0);m.fill();m.stroke();
        m.strokeStyle='rgba(220,255,180,.42)';m.lineWidth=.8*sc;m.beginPath();m.moveTo(q.r*.1,0);m.lineTo(len*.88,0);m.stroke();
        m.restore();
      }
      // coconut cluster at crown
      m.fillStyle='#6e4726';for(let i=0;i<3;i++){const a=q.a+i*2.1;m.beginPath();m.arc(q.x+Math.cos(a)*q.r*.13,q.y+Math.sin(a)*q.r*.13,q.r*.13,0,7);m.fill();}
      continue;
    }
    if(D){
      if(q.k<.55){ // detailed saguaro cactus with sunlit highlights
        for(const[dx,dy,rr]of[[Math.cos(q.a)*q.r,Math.sin(q.a)*q.r,.56],[-Math.cos(q.a)*q.r*.88,-Math.sin(q.a)*q.r*.88,.5],[0,0,1]]){
          const cg=m.createRadialGradient(q.x+dx-q.r*rr*.3,q.y+dy-q.r*rr*.3,q.r*rr*.1,q.x+dx,q.y+dy,q.r*rr);
          cg.addColorStop(0,'#52ab68');cg.addColorStop(.7,'#2d7a47');cg.addColorStop(1,'#194c2b');
          m.fillStyle=cg;m.strokeStyle='#164024';m.lineWidth=1.2*sc;
          m.beginPath();m.arc(q.x+dx,q.y+dy,q.r*rr,0,7);m.fill();m.stroke();
        }
        m.strokeStyle='rgba(225,248,200,.7)';m.lineWidth=.9*sc;m.beginPath();
        for(let i=0;i<6;i++){const a=q.a+i*Math.PI/3;m.moveTo(q.x,q.y);m.lineTo(q.x+Math.cos(a)*q.r*.78,q.y+Math.sin(a)*q.r*.78);}m.stroke();
        if(q.k<.22){m.fillStyle='#ffdf5d';m.beginPath();m.arc(q.x-q.r*.15,q.y-q.r*.15,q.r*.22,0,7);m.fill();}
      }else{ // layered red-rock mesa boulder
        m.fillStyle='#965c38';m.strokeStyle='#5a331c';m.lineWidth=1.3*sc;
        m.beginPath();m.ellipse(q.x,q.y,q.r*1.16,q.r*.86,q.a,0,7);m.fill();m.stroke();
        m.fillStyle='#c48454';m.beginPath();m.ellipse(q.x-q.r*.2,q.y-q.r*.2,q.r*.68,q.r*.46,q.a,0,7);m.fill();
        m.fillStyle='#e4ab7a';m.beginPath();m.ellipse(q.x-q.r*.3,q.y-q.r*.28,q.r*.34,q.r*.2,q.a,0,7);m.fill();
      }
      continue;
    }
    // Parkland: lush multi-lobed illustrated leafy canopy
    drawTreeCluster(m,q.x,q.y,q.r,PARK_PALS[Math.floor(q.k*PARK_PALS.length)],q.a,R);
  }
  return c;
}

// Detailed top-down golfer. face = direction (radians); s = size in px; swing = club angle or null; clubCat = 'driver'|'iron'|'wedge'|'putter'; blurArc = swing swoosh alpha
function drawGolfer(c,x,y,face,look,s,swing,clubCat,blurArc){
  c.save();c.translate(x,y);
  // soft ground shadow offset to bottom-right
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(s*.22,s*.32,s*.96,s*.68,0,0,7);c.fill();
  c.rotate(face);c.lineCap='round';c.lineJoin='round';
  // subtle golf shoes peeking beneath stance
  c.fillStyle='#f4f4ee';c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=Math.max(.8,s*.04);
  c.beginPath();c.ellipse(s*.18,-s*.54,s*.24,s*.14,.15,0,7);c.fill();c.stroke();
  c.beginPath();c.ellipse(s*.18,s*.54,s*.24,s*.14,-.15,0,7);c.fill();c.stroke();
  if(swing!=null){
    // optional motion-blur swing swoosh arc
    if(blurArc&&blurArc>0.03){
      c.save();c.translate(s*.45,0);
      c.strokeStyle=`rgba(255,250,215,${(blurArc*.55).toFixed(3)})`;
      c.lineWidth=Math.max(2,s*.32);
      c.beginPath();c.arc(0,0,s*1.25,swing,swing+1.25);c.stroke();
      c.restore();
    }
    c.save();c.translate(s*.46,0);c.rotate(swing);
    // shaft with metallic sheen
    c.strokeStyle='#e4ece6';c.lineWidth=Math.max(1.5,s*.09);
    c.beginPath();c.moveTo(-s*.12,0);c.lineTo(s*1.46,0);c.stroke();
    // grip
    c.strokeStyle='#1d2420';c.lineWidth=Math.max(2,s*.13);
    c.beginPath();c.moveTo(-s*.16,0);c.lineTo(s*.28,0);c.stroke();
    // distinct clubhead by category
    if(clubCat==='driver'){
      c.fillStyle='#2c343d';c.strokeStyle='#b8c4cc';c.lineWidth=Math.max(.8,s*.04);
      c.beginPath();c.ellipse(s*1.52,s*.1,s*.24,s*.34,.15,0,7);c.fill();c.stroke();
      c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(s*1.48,s*.02,s*.09,s*.14,.15,0,7);c.fill();
    }else if(clubCat==='putter'){
      c.fillStyle='#c9d2d8';c.strokeStyle='#39444c';c.lineWidth=Math.max(.8,s*.04);
      c.fillRect(s*1.36,-s*.08,s*.16,s*.38);c.strokeRect(s*1.36,-s*.08,s*.16,s*.38);
    }else{
      c.fillStyle='#bfc9cf';c.strokeStyle='#39444c';c.lineWidth=Math.max(.8,s*.04);
      c.beginPath();c.roundRect(s*1.36,-s*.08,s*.2,s*.34,s*.05);c.fill();c.stroke();
    }
    c.restore();
    // arms + white golf glove on lead hand
    c.strokeStyle=look.skin;c.lineWidth=s*.22;c.beginPath();c.moveTo(0,-s*.58);c.lineTo(s*.46,0);c.lineTo(0,s*.58);c.stroke();
    c.fillStyle='#f8faf8';c.beginPath();c.arc(s*.46,0,s*.13,0,7);c.fill();
  }
  // polo shirt torso with subtle shoulder highlight
  c.fillStyle=look.shirt;c.strokeStyle='rgba(0,0,0,.38)';c.lineWidth=Math.max(1,s*.055);
  c.beginPath();c.ellipse(0,0,s*.46,s*.86,0,0,7);c.fill();c.stroke();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(-s*.08,-s*.14,s*.28,s*.58,0,0,7);c.fill();
  // collar detail
  c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=Math.max(1,s*.06);
  c.beginPath();c.arc(s*.04,0,s*.42,-.8,.8);c.stroke();
  // head & hair
  c.fillStyle=look.skin;c.beginPath();c.arc(s*.08,0,s*.42,0,7);c.fill();
  c.fillStyle=look.hair;c.beginPath();c.arc(-s*.04,0,s*.41,0,7);c.fill();
  const hs=look.hatStyle;c.fillStyle=look.hat;c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=Math.max(.9,s*.045);
  if(hs==='cap'){
    c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(s*.45,s*.05,s*.27,s*.34,0,0,7);c.fill();
    c.fillStyle=look.hat;c.beginPath();c.ellipse(s*.42,0,s*.27,s*.34,0,0,7);c.fill();c.stroke();
    c.beginPath();c.arc(0,0,s*.43,0,7);c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.24)';c.beginPath();c.arc(-s*.09,-s*.09,s*.2,0,7);c.fill();
    c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.arc(0,0,s*.06,0,7);c.fill();
  }else if(hs==='visor'){
    c.beginPath();c.ellipse(s*.42,0,s*.27,s*.35,0,0,7);c.fill();c.stroke();
    c.strokeStyle=look.hat;c.lineWidth=s*.13;c.beginPath();c.arc(0,0,s*.4,-1.9,1.9);c.stroke();
  }else if(hs==='bucket'){
    c.beginPath();c.arc(0,0,s*.63,0,7);c.fill();c.stroke();
    c.fillStyle='rgba(0,0,0,.15)';c.beginPath();c.arc(0,0,s*.38,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(-s*.08,-s*.08,s*.2,0,7);c.fill();
  }
  c.restore();
}

function startRound(course,idxs,opt){
  opt=opt||{};
  S={course,idxs,i:0,scores:[],practice:!!opt.practice,onDone:opt.onDone,tour:opt.tour,xp:0,coins:0,ups:0};
  $('#ui').classList.add('hidden');$('#hud').classList.remove('hidden');
  startHole();
}
function startHole(){
  const h=S.course.holes[S.idxs[S.i]];S.h=h;S.bmp=holeBitmap(h);S.fx=initFx(h);
  S.ball={x:h.tee.x,y:h.tee.y,z:0};S.last={x:h.tee.x,y:h.tee.y};S.strokes=0;S.lipOut=false;
  const wmax=h.wind||({tropical:28,mountain:34,desert:24,fantasy:26}[h.theme]||22);
  const wmph=Math.random()<.08?Math.round(1+Math.random()*2):Math.round(3+Math.pow(Math.random(),1.35)*(wmax-3));
  S.wind={a:Math.random()*6.283,mph:wmph};
  S.state='aim';S.power=0;S.accv=0;S.msg=null;S.after=null;S.cam=null;S.fireT=0;
  S.aim=Math.atan2(h.pin.y-h.tee.y,h.pin.x-h.tee.x);S.gaim=S.aim;mouse.moved=false;
  pickClub();
}
const distPin=()=>Math.hypot(S.h.pin.x-S.ball.x,S.h.pin.y-S.ball.y);
function lie(){const h=S.h,b=S.ball;if(b.x===h.tee.x&&b.y===h.tee.y)return'e';const t=terrainAt(h,b.x,b.y);return(t==='w'||t==='o')?'r':t;}
function allowed(i){const l=lie(),c=CLUBS[i];if(l==='g')return c.cat==='putter';if(c.cat==='driver')return l==='e'||l==='f';return true;}
function shotMax(){const c=CLUBS[S.club];return c.cat==='putter'?S.puttMax:clubMax(c,lie());}
function pickClub(){
  const l=lie(),d=distPin();
  if(l==='g')S.club=11;
  else{let best=10;for(let i=10;i>=0;i--){if(!allowed(i))continue;if(i===0&&l!=='e')continue;best=i;if(clubMax(CLUBS[i],l)*(1+CLUBS[i].roll*.6)>=d)break;}S.club=best;}
  S.puttMax=[8,15,30,50].find(v=>v>=d*1.35)||50;
  updateHud();
}
function changeClub(dir){
  if(!S||S.state!=='aim')return;let i=S.club+dir;
  while(i>=0&&i<CLUBS.length&&!allowed(i))i+=dir;
  if(i>=0&&i<CLUBS.length){S.club=i;SFX.club();updateHud();}
}
const DIR_SHORT=['E','SE','S','SW','W','NW','N','NE'];
function updateHud(){
  if(!S)return;const h=S.h,d=distPin(),c=CLUBS[S.club],l=lie(),lt=terOf(h,l);
  const rel=S.scores.reduce((a,s,i)=>a+s-S.course.holes[S.idxs[i]].par,0);
  const dtxt=(l==='g'&&d<20)?Math.round(d*3)+' ft':Math.round(d)+' yd';
  const hname=h.name?` &middot; ${esc(h.name)}`:'';
  const slInfo=(l==='g'&&h.slope&&h.slope.str)?` &bull; <b>${['','Gentle','Medium','Steep'][h.slope.str]} slope ${DIR_SHORT[h.slope.dir]}</b>`:'';
  const deckTag=(l==='f'&&c.cat==='driver')?' &bull; <span class="over">Off the deck (high risk)</span>':'';
  $('#hudTxt').innerHTML=`Hole <b>${S.idxs[S.i]+1}</b>${hname} &bull; Par ${h.par} &bull; ${holeYards(h)} yd &bull; Round <b>${fmtRel(rel)}</b>${S.practice?' &bull; Practice':S.tour!=null?' &bull; Tour':''}<br>Stroke ${S.strokes+1} &bull; <b>${dtxt}</b> to pin &bull; <span class="lieDot" style="background:${lt.col}"></span>${lt.name}${slInfo}`;
  $('#clubName').innerHTML=`<b>${c.name}</b><span class="small">${c.cat==='putter'?'up to '+S.puttMax+' yd':Math.round(shotMax())+' yd carry'}${deckTag}</span>`;
}
function setMsg(t,sub){S.msg={text:t,sub:sub||'',t:0};}

function action(){
  if(!S||modalOpen())return;
  if(S.state==='aim'){S.state='power';S.mt=0;S.power=0;SFX.ui();}
  else if(S.state==='power'){if(S.power<.04){S.state='aim';return;}S.state='acc';S.mt=0;S.accv=-1;SFX.ui();}
  else if(S.state==='acc')fire();
}
function cancelSwing(){if(S&&(S.state==='power'||S.state==='acc')){S.state='aim';S.power=0;}}
function fire(){
  const p=save.profile,club=CLUBS[S.club],l=lie(),put=club.cat==='putter',offDeck=l==='f'&&club.cat==='driver';
  // Accuracy zones:
  //   centre sweet spot (a < ACC_IN):  dead straight, 100% power
  //   light green zone  (a < ACC_OUT): 3.5 to 9.5 deg off line, slight 2-6% distance shave
  //   outside green     (a >= ACC_OUT): 9.5 to 28 deg off line, 8-20% mishit distance loss
  //   driver off the deck: harsher directional spray (1.45x) and heavy topped-ball distance loss if not pure
  let v=S.accv;const a=Math.abs(v),perfect=a<ACC_IN,wild=a>=ACC_OUT;

function updateFx(dt){

  fx.now+=dt;

  if(S.state!=='flight'&&fx.trailFade>0)fx.trailFade=Math.max(0,fx.trailFade-dt*.65);
  for(const cl of fx.clouds){
    cl.x+=Math.cos(wa)*wsp*cl.sp*dt;cl.y+=Math.sin(wa)*wsp*cl.sp*dt;

    if(cl.y<-cl.ry*2)cl.y=H+cl.ry*2;if(cl.y>H+cl.ry*2)cl.y=-cl.ry*2;
  }

  }

    if(bd.x<-40)bd.x=W+40;if(bd.x>W+40)bd.x=-40;if(bd.y<-40)bd.y=H+40;if(bd.y>H+40)bd.y=-40;

    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vz-=pt.grav*dt;pt.z=Math.max(0,pt.z+pt.vz*dt);

function drawFlag(c,px,py,fl,now,windMph,windAng){

  // pole

  fg.addColorStop(0,'#f24653');fg.addColorStop(.55,'#d92638');fg.addColorStop(1,'#a81626');
  c.fillStyle=fg;c.strokeStyle='rgba(255,235,160,.7)';c.lineWidth=1;

}

function draw(dt){

      for(let x=ox;x<=ox+hw;x+=stSp){for(const sy of[oy,oy+hh]){if(x>-10&&x<VW+10&&sy>-10&&sy<VH+10){ctx.beginPath();ctx.arc(x,sy,2.2,0,7);ctx.fill();ctx.stroke();}}}

/* ---------------- animated live course backdrop behind menus ---------------- */
let MENU_BG=null;
function drawMenuBackdrop(dt){
  if(!MENU_BG){
    const h=BUILTIN[0].holes[2]; // Cedar Ridge #3 Mill Pond
    MENU_BG={h,bmp:holeBitmap(h,4),t:0};
  }
  MENU_BG.t+=dt;
  const h=MENU_BG.h,bmp=MENU_BG.bmp,t=MENU_BG.t;
  const s=clamp(Math.max(VW/(h.cols*TILE),VH/(h.rows.length*TILE))*1.15,5,9);
  const cx=h.cols*TILE*.5+Math.sin(t*.16)*18,cy=h.rows.length*TILE*.5+Math.cos(t*.12)*28;
  const ox=(0-cx)*s+VW/2,oy=(0-cy)*s+VH/2;
  ctx.save();ctx.translate(ox,oy);ctx.scale(s/PPY,s/PPY);
  ctx.fillStyle=ctx.createPattern(makeGroundPattern(h.theme,'outer'),'repeat')||'#12301b';
  ctx.fillRect(-ox*PPY/s-40,-oy*PPY/s-40,VW*PPY/s+80,VH*PPY/s+80);ctx.restore();
  ctx.drawImage(bmp,ox,oy,h.cols*TILE*s,h.rows.length*TILE*s);
  // live water sparkles & waving flag on backdrop
  if(bmp._waterPts){
    for(const pt of bmp._waterPts){
      const sx=(pt.x-cx)*s+VW/2,sy=(pt.y-cy)*s+VH/2;
      const v=Math.sin(t*2.1+pt.p);if(v<.35)continue;
      ctx.strokeStyle=`rgba(235,252,255,${((v-.35)/.65*.45).toFixed(2)})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sx-5,sy);ctx.quadraticCurveTo(sx,sy-2,sx+5,sy);ctx.stroke();
    }
  }
  drawFlag(ctx,(h.pin.x-cx)*s+VW/2,(h.pin.y-cy)*s+VH/2,32,t,8,0.4);
  // lush atmospheric dark-emerald overlay so menus read effortlessly
  const ov=ctx.createRadialGradient(VW*.5,VH*.4,60,VW*.5,VH*.5,Math.max(VW,VH)*.8);
  ov.addColorStop(0,'rgba(12,38,21,.48)');ov.addColorStop(1,'rgba(5,17,9,.78)');
  ctx.fillStyle=ov;ctx.fillRect(0,0,VW,VH);
}

let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  if(S){if(!S.cam)draw(0);update(dt);if(S)draw(dt);}else drawMenuBackdrop(dt);
  requestAnimationFrame(frame);
}

function preview(id,look){

  const g=c.getContext('2d'),w=c.width,h=c.height;
  g.clearRect(0,0,w,h);
  // miniature manicured tee-box turf with mowed stripes & soft sunlight
  const bg=g.createRadialGradient(w*.35,h*.3,w*.08,w*.5,h*.5,w*.78);
  bg.addColorStop(0,'#7ed468');bg.addColorStop(.68,'#54ab46');bg.addColorStop(1,'#34752e');
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,220,.09)';for(let y=0;y<h;y+=h*.24)g.fillRect(0,y,w,h*.12);
  g.fillStyle='#fffef6';g.beginPath();g.arc(w*.74,h*.6,Math.max(2.5,w*.028),0,7);g.fill();
  drawGolfer(g,w*.42,h*.6,-Math.PI/2,look,w*.26,.45,'driver',0);
}

/* ---------------- tours ----------------
   Each tour is five 18-hole events in order of difficulty. An event is played against a field of computer
   golfers whose scores are rolled when the round ends: mean = strokes over par for an average field golfer,
   sd = spread. Finish in the top TOUR_CUT to qualify and unlock the next event; qualify in all five to
   complete the tour, which unlocks the next tour. */
const TOURS=[
  {name:'Qualifying Tour',flag:'card',prize:[500,200],doneMsg:'Tour Card earned! You qualified in all five events.',
   blurb:'Five tough events on the standard courses. With starter gear you will need smart course management and upgrades to finish top 3 in all five.',
   events:[{id:'builtin1',mean:9,sd:3.2},{id:'builtin3',mean:7,sd:3.2},{id:'builtin2',mean:5,sd:3},{id:'builtin4',mean:3,sd:3},{id:'builtin5',mean:1,sd:2.8}]},
  {name:'Rookie Tour',flag:'rookie',prize:[1000,400],wins:2,doneMsg:'Rookie Tour complete!',
   blurb:'The same five courses set up harder: longer, narrower fairways, extra sentinel trees, bunkers and water. Stronger fields and doubled prizes. Complete it by qualifying in all five events, or by winning any two.',
   events:[{id:'rookie1',mean:2,sd:2.8},{id:'rookie3',mean:0,sd:2.8},{id:'rookie2',mean:-1,sd:2.8},{id:'rookie4',mean:-3,sd:2.6},{id:'rookie5',mean:-4,sd:2.6}]},
  {name:'Pro Tour',flag:'pro',prize:[2500,800],wins:2,doneMsg:'Pro Tour complete! You are the Tour Champion.',
   blurb:'Three championship courses built to punish mistakes: howling mountain switchbacks, lava-crossed fantasy fairways, and the Five Realms finale. Tripled prizes.',
   events:[{id:'pro1',mean:-3,sd:2.6},{id:'pro2',mean:-5,sd:2.5},{id:'pro3',mean:-7,sd:2.5}]}
];
const TOUR_FIELD=['Ace Barlow','Mia Fontaine','Rory Finch','Sam Okafor','Lena Brandt','Tomas Vega','Priya Nair','Gus Halloran','Yuki Mori','Dana Whitlock','Otis Greer'];
const TOUR_CUT=3;
const tourCourse=e=>BUILTIN.concat(ROOKIE,PRO).find(c=>c.id===e.id);
// a tour is complete with a top-TOUR_CUT finish in every event, or (if the tour sets `wins`) that many different events won
const tourWins=(tour,t)=>tour.events.filter(e=>t.pos[e.id]===1).length;
const tourDone=(tour,t)=>tour.events.every(e=>t.pos[e.id]<=TOUR_CUT)||(tour.wins&&tourWins(tour,t)>=tour.wins);
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)/.577;
function tourResult(R,total,par){
  const p=save.profile,tour=TOURS[R.tour.t],ev=tour.events[R.tour.e],t=p.tour||(p.tour={pos:{}}),m=R.tour.t+1;
  const rows=TOUR_FIELD.map((n,i)=>({name:n,score:par+Math.round(ev.mean+(i-5)*.5+ev.sd*gauss())}));
  rows.push({name:p.name,score:total,me:true});
  rows.sort((a,b)=>a.score-b.score||(a.me?-1:b.me?1:0)); // the player wins ties
  const pos=rows.findIndex(r=>r.me)+1,q=pos<=TOUR_CUT;
  let xp=(pos===1?150:q?60:0)*m,coins=(pos===1?300:q?120:0)*m;
  if(t.pos[ev.id]==null||pos<t.pos[ev.id])t.pos[ev.id]=pos;
  let done='';if(!t[tour.flag]&&tourDone(tour,t)){t[tour.flag]=true;done=tour.doneMsg;coins+=tour.prize[0];xp+=tour.prize[1];}
  if(xp){R.ups+=addXp(xp);R.xp+=xp;}p.coins+=coins;R.coins+=coins;
  R.tourRes={rows,pos,q,done};
}
function showTour(){
  const p=save.profile,t=p.tour||{pos:{}},qd=e=>t.pos[e.id]<=TOUR_CUT,last=TOURS[TOURS.length-1];
  UI.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">Tours</h2><span class="sp"></span><button id="tBack">&#8592; Main menu</button><button id="tArc" class="arcade">&#8592; Arcade</button></div>
  <p>Each event is 18 holes against a field of ${TOUR_FIELD.length} other golfers. Finish in the top ${TOUR_CUT} to qualify and unlock the next event. Winning an event pays a bigger prize.</p>
  ${TOURS.map((tour,ti)=>{const unlocked=ti===0||t[TOURS[ti-1].flag],n=tour.events.filter(qd).length;
    return `<h3>${tour.name} &mdash; ${t[tour.flag]?'complete':unlocked?n+' of '+tour.events.length+' qualified'+(tour.wins?', '+tourWins(tour,t)+' of '+tour.wins+' wins':''):'locked'}</h3><p class="small">${tour.blurb}</p>`+
    (!unlocked?`<div class="card"><div class="small">Locked. Complete the ${TOURS[ti-1].name} first.</div></div>`:
    tour.events.map((e,i)=>{const c=tourCourse(e),open=i===0||qd(tour.events[i-1]),ps=t.pos[e.id];
      return `<div class="card row" style="${qd(e)?'border-color:var(--good)':''}"><div style="flex:1;min-width:180px"><div class="t">Event ${i+1}: ${esc(c.name)}</div><div class="small">Par ${coursePar(c)} &bull; ${courseYards(c)} yd &bull; ${ps?`Best finish: <b>${ord(ps)}</b>${qd(e)?' &mdash; qualified':''}`:open?'Not played yet':'Locked'}</div></div><button data-vm="${ti}:${i}">Map</button><button data-vh="${ti}:${i}">Holes</button>${open?`<button class="${qd(e)?'':'primary'}" data-ev="${ti}:${i}">${qd(e)?'Play again':'Play event'}</button>`:`<button disabled>Top ${TOUR_CUT} in event ${i} to unlock</button>`}</div>`;}).join(''));}).join('')}
  ${t[last.flag]?'<div class="card" style="border-color:var(--acc);margin-top:16px"><div class="t">Tour Champion</div><div class="small">You have completed every tour. All events stay open to replay.</div></div>':''}</div>`;
  $('#tBack').onclick=()=>{SFX.ui();showMenu();};$('#tArc').onclick=goArcade;
  $$('[data-ev]',UI).forEach(b=>b.onclick=()=>{const[ti,i]=b.dataset.ev.split(':').map(Number);startRound(tourCourse(TOURS[ti].events[i]),[...Array(18).keys()],{tour:{t:ti,e:i}});});
  $$('[data-vm]',UI).forEach(b=>b.onclick=()=>{const[ti,i]=b.dataset.vm.split(':').map(Number);showMap(tourCourse(TOURS[ti].events[i]),showTour);});
  $$('[data-vh]',UI).forEach(b=>b.onclick=()=>{const[ti,i]=b.dataset.vh.split(':').map(Number);showHoles(tourCourse(TOURS[ti].events[i]),0,showTour);});
}

async function sbCall(fn,body){

// overhead map of all 18 holes. Holes sit edge to edge and alternate direction, so each green is next to the following tee.
const mapCache=new Map();let mapToken=0;
function showMap(course,back){
  const tok=++mapToken,H=course.holes,n=H.length,nc=innerWidth<700?3:9,nr=Math.ceil(n/nc),cw=nc===3?300:220,MPPY=3;
  const kf=h=>cw/(h.cols*TILE*MPPY),hh=h=>h.rows.length*TILE*MPPY*kf(h);
  const rowH=[...Array(nr)].map((_,r)=>Math.ceil(Math.max(...H.slice(r*nc,r*nc+nc).map(hh)))),rowY=rowH.map((_,r)=>rowH.slice(0,r).reduce((a,b)=>a+b,0));

  const pt=(i,x,y)=>{const h=H[i],ce=cell(i),k=kf(h)*MPPY,lx=x*k-cw/2,ly=y*k-hh(h)/2,sg=ce.up?1:-1;return[ce.x+cw/2+lx*sg,ce.y+ce.h/2+ly*sg];};

  UI.innerHTML=`<div class="panel wide"><div class="row"><h2 style="margin:0">${esc(course.name)} &mdash; Course map</h2><span class="sp"></span><button id="mpBack">&#8592; Back</button><button id="mpHome">Main menu</button><button id="mpArc" class="arcade">&#8592; Arcade</button></div>
  <p><span class="tag">Par ${coursePar(course)}</span><span class="tag">${courseYards(course).toLocaleString()} yd</span><span class="tag">Front 9: ${half(0,9)}</span><span class="tag">Back 9: ${half(9,18)}</span></p>
  <canvas id="mpCv" style="width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer"></canvas>
  <p class="small" id="mpNote">Drawing map&hellip;</p></div>`;
  $('#mpBack').onclick=()=>{SFX.ui();mapToken++;back?back():save.profile?showCourses('play'):showMenu();};
  $('#mpHome').onclick=()=>{SFX.ui();mapToken++;showMenu();};
  $('#mpArc').onclick=()=>{mapToken++;goArcade();};
  const c=$('#mpCv');c.width=W;c.height=HT;const g=c.getContext('2d');
  c.onclick=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*HT/r.height;
    for(let i=0;i<n;i++){const ce=cell(i);if(x>=ce.x&&x<ce.x+cw&&y>=ce.y&&y<ce.y+ce.h){mapToken++;showHoles(course,i,()=>showMap(course,back));return;}}};
  const done=()=>{$('#mpNote').textContent='Numbers mark the tees, flags mark the greens, labels give par and yards. Tap a hole for a closer look.';};

  const key=nc+':'+u.toFixed(2)+':'+JSON.stringify(H.map(h=>[h.theme,h.rows])),old=mapCache.get(course);
  if(old&&old.key===key){g.drawImage(old.cv,0,0);done();return;}
  const overlay=()=>{
    g.lineCap='round';g.setLineDash([2*u,4*u]);g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1.3*u; // walk from each green to the next tee

    for(let i=0;i<n;i++){const h=H[i],ce=cell(i),[px,py]=pt(i,h.pin.x,h.pin.y),[tx,ty]=pt(i,h.tee.x,h.tee.y);
      g.fillStyle='#111';g.beginPath();g.arc(px,py,1.6*u,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.4*u;g.beginPath();g.moveTo(px,py);g.lineTo(px,py-14*u);g.stroke();
      g.fillStyle='#e63946';g.beginPath();g.moveTo(px,py-14*u);g.lineTo(px+8*u,py-11*u);g.lineTo(px,py-8*u);g.fill();
      g.fillStyle='#f4c542';g.strokeStyle='#14301c';g.lineWidth=1.5*u;g.beginPath();g.arc(tx,ty,9*u,0,7);g.fill();g.stroke();
      g.fillStyle='#14301c';g.font='bold '+10.5*u+'px Segoe UI,sans-serif';g.fillText(i+1,tx,ty+.5*u);
      const lab='Par '+h.par+' • '+holeYards(h),ly=ce.up?Math.min(ty+17*u,ce.y+ce.h-9*u):Math.max(ty-17*u,ce.y+9*u),lx=clamp(tx,ce.x+33*u,ce.x+cw-33*u);
      g.font='bold '+10*u+'px Segoe UI,sans-serif';g.lineWidth=2.5*u;g.strokeStyle='rgba(0,0,0,.75)';g.strokeText(lab,lx,ly);g.fillStyle='#fff';g.fillText(lab,lx,ly);}
    const cv=document.createElement('canvas');cv.width=W;cv.height=HT;cv.getContext('2d').drawImage(c,0,0);mapCache.set(course,{key,cv});done();};
  let i=0;
  (function step(){ // one hole per tick so the page stays responsive
    if(tok!==mapToken)return;if(i>=n){overlay();return;}
    const h=H[i],ce=cell(i),bmp=holeBitmap(h,MPPY),th=hh(h);
    g.fillStyle=terOf(h,'r').col;g.fillRect(ce.x,ce.y,cw,ce.h);
    if(ce.h-th>2){const ps=Math.max(8,Math.round(60*kf(h))),pc=document.createElement('canvas');pc.width=pc.height=ps;pc.getContext('2d').drawImage(bmp,0,0,60,60,0,0,ps,ps); // space beyond a short hole: repeat the hole's own corner
      g.fillStyle=g.createPattern(pc,'repeat');g.fillRect(ce.x,ce.y,cw,ce.h);}
    g.save();g.translate(ce.x+cw/2,ce.y+ce.h/2);if(!ce.up)g.rotate(Math.PI);g.drawImage(bmp,-cw/2,-th/2,cw,th);g.restore();
    i++;$('#mpNote').textContent='Drawing map\u2026 hole '+i+' of '+n;setTimeout(step,0);
  })();
}

/* ---------------- course designer ---------------- */
const DIRS=['East','South-east','South','South-west','West','North-west','North','North-east'];
function showEditor(course,hi){
  const E={tool:'f',brush:2,zoom:innerWidth<700?8:10,down:false};let h=course.holes[hi];
  UI.innerHTML=`<div id="ed"><div id="edSide">
    <h3 style="margin-top:0">Course</h3><input type="text" id="eName" maxlength="30" style="width:100%">
    <h3>Hole</h3><div class="holes" id="eHoles"></div>
    <div class="row" style="margin-top:10px"><label>Par <select id="ePar"><option>3</option><option>4</option><option>5</option></select></label><label>Length <input type="number" id="eRows" min="100" max="750" step="5" style="width:74px"> yd</label></div>
    <div class="small" id="eInfo" style="margin-top:6px"></div>
    <h3>Paint</h3><div class="tools" id="eTools"></div>
    <div class="row" style="margin-top:8px"><label>Brush size <input type="range" id="eBrush" min="1" max="6" value="2"></label></div>
    <h3>Green slope</h3><div class="row"><select id="eDir">${DIRS.map((d,i)=>`<option value="${i}">Toward ${d}</option>`).join('')}</select><select id="eStr"><option value="0">Flat</option><option value="1">Gentle</option><option value="2">Medium</option><option value="3">Steep</option></select></div>
    <h3>Hole tools</h3><div class="row"><button id="eGen">Random hole</button><button id="eClear">Clear</button><button id="eZo">Zoom &minus;</button><button id="eZi">Zoom +</button></div>
    <button class="big primary" id="eTest">Test play this hole</button><button class="big" id="eDone">Save &amp; close</button>
    <div class="row" style="margin-top:6px"><button id="eHome" style="flex:1">&#8592; Main menu</button><button id="eArc" class="arcade" style="flex:1">&#8592; Arcade</button></div>
    <p class="small">Tee is at the bottom, green at the top. Paint with the mouse or a finger; place the tee and the pin with their tools. On a touch screen, pick &ldquo;Scroll hole&rdquo; to move around the hole without painting. Changes save automatically.</p>
  </div><div id="edMain"><canvas id="edCv"></canvas></div></div>`;
  const cvs=$('#edCv'),g=cvs.getContext('2d');
  function redraw(){
    const z=E.zoom,n=h.rows.length;cvs.width=h.cols*z;cvs.height=n*z;
    for(let y=0;y<n;y++){const r=h.rows[y];for(let x=0;x<h.cols;x++){g.fillStyle=terOf(h,r[x]).col;g.fillRect(x*z,y*z,z,z);}}
    if(z>=8){g.strokeStyle='rgba(0,0,0,.08)';g.lineWidth=1;g.beginPath();for(let x=0;x<=h.cols;x++){g.moveTo(x*z+.5,0);g.lineTo(x*z+.5,n*z);}for(let y=0;y<=n;y++){g.moveTo(0,y*z+.5);g.lineTo(h.cols*z,y*z+.5);}g.stroke();}
    const k=z/TILE,tx=h.tee.x*k,ty=h.tee.y*k,px=h.pin.x*k,py=h.pin.y*k;
    g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=1.5;g.beginPath();g.arc(tx,ty,5,0,7);g.fill();g.stroke();g.fillStyle='#000';g.font='bold 8px sans-serif';g.textAlign='center';g.fillText('T',tx,ty+3);
    g.fillStyle='#111';g.beginPath();g.arc(px,py,3,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(px,py);g.lineTo(px,py-16);g.stroke();g.fillStyle='#e63946';g.beginPath();g.moveTo(px,py-16);g.lineTo(px+9,py-12);g.lineTo(px,py-8);g.fill();
  }
  function sync(){
    h=course.holes[hi];$('#eName').value=course.name;
    $('#eHoles').innerHTML=course.holes.map((x,i)=>`<button data-h="${i}" class="${i===hi?'sel':''}">${i+1}</button>`).join('');
    $$('[data-h]',UI).forEach(b=>b.onclick=()=>{hi=+b.dataset.h;sync();$('#edMain').scrollTop=0;});
    $('#ePar').value=h.par;$('#eRows').value=h.rows.length*TILE;$('#eDir').value=h.slope?h.slope.dir:0;$('#eStr').value=h.slope?h.slope.str:0;
    $('#eTools').innerHTML=PAINTABLE.map(c=>`<button data-t="${c}" class="${E.tool===c?'sel':''}"><i style="background:${terOf(h,c).col}"></i>${terOf(h,c).name}</button>`).join('')+
      `<button data-t="tee" class="${E.tool==='tee'?'sel':''}"><i style="background:#fff;border-radius:50%"></i>Place tee</button><button data-t="pin" class="${E.tool==='pin'?'sel':''}"><i style="background:#e63946"></i>Place pin</button><button data-t="pan" class="${E.tool==='pan'?'sel':''}"><i style="background:#9aa"></i>Scroll hole</button>`;
    cvs.style.touchAction=E.tool==='pan'?'auto':'none';
    $$('[data-t]',UI).forEach(b=>b.onclick=()=>{E.tool=b.dataset.t;sync();});
    info();redraw();
  }
  function info(){const pt=terrainAt(h,h.pin.x,h.pin.y);$('#eInfo').innerHTML=`Hole ${hi+1}: ${holeYards(h)} yd tee to pin &bull; course par ${coursePar(course)}`+(pt!=='g'?'<br><span class="over">The pin is not on a green.</span>':'');}
  function paint(e){
    const r=cvs.getBoundingClientRect(),fx=(e.clientX-r.left)/E.zoom,fy=(e.clientY-r.top)/E.zoom,n=h.rows.length;
    if(fx<0||fy<0||fx>=h.cols||fy>=n)return;
    if(E.tool==='tee'||E.tool==='pin'){h[E.tool]={x:Math.round(fx*TILE*2)/2,y:Math.round(fy*TILE*2)/2};}
    else{const rad=E.brush/2,cx=Math.floor(fx),cy=Math.floor(fy);
      for(let y=Math.max(0,Math.floor(fy-rad));y<=Math.min(n-1,Math.ceil(fy+rad));y++){let row=h.rows[y],ch=false;
        for(let x=Math.max(0,Math.floor(fx-rad));x<=Math.min(h.cols-1,Math.ceil(fx+rad));x++)if((x===cx&&y===cy)||(x+.5-fx)**2+(y+.5-fy)**2<=rad*rad){if(row[x]!==E.tool){row=row.slice(0,x)+E.tool+row.slice(x+1);ch=true;}}
        if(ch)h.rows[y]=row;}}
    redraw();
  }
  cvs.onpointerdown=e=>{if(E.tool==='pan')return;E.down=true;cvs.setPointerCapture(e.pointerId);paint(e);};
  cvs.onpointermove=e=>{if(E.down&&E.tool.length===1)paint(e);};
  cvs.onpointerup=cvs.onpointercancel=()=>{if(E.down){E.down=false;persist();info();}};
  $('#eName').oninput=e=>{course.name=e.target.value.trim()||'My Course';persist();};
  $('#ePar').onchange=e=>{h.par=+e.target.value;persist();info();};
  $('#eRows').onchange=e=>{const want=clamp(Math.round((+e.target.value||0)/TILE),20,150),d=want-h.rows.length;
    if(d>0)h.rows=Array.from({length:d},()=>'r'.repeat(h.cols)).concat(h.rows);else if(d<0)h.rows=h.rows.slice(-d);
    const my=h.rows.length*TILE-1;for(const k of['tee','pin'])h[k]={x:h[k].x,y:clamp(h[k].y+d*TILE,1,my)};persist();sync();};
  $('#eBrush').oninput=e=>E.brush=+e.target.value;
  $('#eDir').onchange=$('#eStr').onchange=()=>{h.slope={dir:+$('#eDir').value,str:+$('#eStr').value};persist();};
  $('#eGen').onclick=()=>{course.holes[hi]=genHole(h.par,rng(Math.floor(Math.random()*1e9)),{theme:h.theme});persist();sync();};
  $('#eClear').onclick=()=>{h.rows=h.rows.map(()=>'r'.repeat(h.cols));persist();sync();};
  $('#eZo').onclick=()=>{E.zoom=Math.max(4,E.zoom-2);redraw();};$('#eZi').onclick=()=>{E.zoom=Math.min(24,E.zoom+2);redraw();};
  $('#eTest').onclick=()=>{persist();startRound(course,[hi],{practice:true,onDone:()=>showEditor(course,hi)});};
  $('#eDone').onclick=()=>{SFX.ui();persist();showCourses('design');};
  $('#eHome').onclick=()=>{SFX.ui();persist();showMenu();};
  $('#eArc').onclick=()=>{persist();goArcade();};
  sync();
}

/* ---------------- boot ---------------- */
loadSave();
if(save.profile)showMenu();else showCreate(true);
requestAnimationFrame(frame);
</script>
